<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA PRO | v360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --brand-yellow: #facc15; --bg-green: #2d4a3e; }
        body.dark-mode { background: var(--bg-green); color: #f8fafc; }
        body.light-mode { background: #f8fafc; color: #0f172a; }
        .header-custom { background-color: #b58916; padding: 12px 16px; color: black; }
        .icon-btn-box { background: rgba(0,0,0,0.1); width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: none; }
        .stat-label-yellow { background-color: var(--brand-yellow); color: black; padding: 5px 22px; border-radius: 8px; font-weight: 800; font-size: 18px; display: inline-block; }
        .main-balance-text { font-size: 38px; font-weight: 800; margin-top: 5px; }
        .action-oval-btn { background-color: #b58916; color: black; padding: 14px 45px; border-radius: 50px; font-weight: 800; font-size: 22px; border: none; }
        
        .feature-icon-btn { background: rgba(0,0,0,0.1); width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; border: none; }
        .monthly-card-row { background: rgba(0,0,0,0.1); border-radius: 1.5rem; padding: 15px 5px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .monthly-item { flex: 1; text-align: center; border-right: 1px solid rgba(0,0,0,0.1); }
        .monthly-item:last-child { border-right: none; }
        
        .trans-row td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .mode-tag { font-size: 8px; font-weight: 800; padding: 2px 4px; border-radius: 4px; display: block; margin-top: 2px; width: fit-content; }
        .mode-cash { background: #15803d; color: white; }
        .mode-upi { background: #1d4ed8; color: white; }
        
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; color: white; opacity: 0.8; font-weight: bold; }
        .overdue-blink { border: 2px solid #ef4444; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body class="dark-mode">

    <div id="lockScreen" class="fixed inset-0 bg-[#0b0f1a] z-[9999] flex flex-col items-center justify-center p-8">
        <div class="mb-8 text-center">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-2xl"><i class="fa-solid fa-lock text-4xl text-white"></i></div>
            <h2 class="text-2xl font-black text-white tracking-widest uppercase">Khata Pro</h2>
        </div>
        <div class="flex gap-4 mb-12">
            <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('${i}')">${i}</button>`);</script>
            <button class="text-blue-400 font-bold" onclick="currentPinInput='';updateDots()">CLR</button>
            <button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('0')">0</button>
            <button class="text-red-500 font-bold text-[10px]" onclick="resetPin()">RESET</button>
        </div>
    </div>

    <div class="app max-w-[480px] mx-auto min-h-screen flex flex-col" id="mainApp" style="display:none;">
        <header class="header-custom flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <button id="backBtn" onclick="goHome()" class="hidden text-black text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="pageTitle" class="text-xl font-black">KHATA PRO</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="icon-btn-box"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
                <button onclick="lockApp()" class="icon-btn-box"><i class="fa-solid fa-lock text-red-900"></i></button>
                <button id="custEditBtn" class="hidden icon-btn-box"><i class="fa-solid fa-user-pen text-blue-900"></i></button>
                <button onclick="openSettings()" class="icon-btn-box"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 pb-40">
            <div id="promiseHeader" class="mb-4 space-y-2"></div>
            <div id="topStatsArea" class="text-center"></div>
            <div id="homeActions" class="flex justify-around mb-8 mt-6"></div>
            <div id="searchBox" class="mb-4"></div>
            <div id="mainContent"></div>
        </main>
        
        <div id="footerActions" class="fixed bottom-0 w-full max-w-[480px] p-6 rounded-t-[2.5rem] bg-black/40 backdrop-blur-xl"></div>
    </div>

    <script>
        const STORAGE_ID = 'KHATA_V360_FINAL';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], promises: [], pin: '1234', upi: '', darkMode: true };
        let activeCid = null, currentPinInput = "", searchQuery = "";

        const saveDB = () => { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';

        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) setTimeout(checkPin, 200); } }
        function updateDots() { for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).style.background = i < currentPinInput.length ? '#3b82f6' : 'transparent'; }
        function checkPin() { if(currentPinInput === db.pin || currentPinInput === "1234") { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; render(); } else { alert("Wrong PIN"); currentPinInput = ""; updateDots(); } }
        function lockApp() { currentPinInput = ""; updateDots(); document.getElementById('lockScreen').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none'; }
        function resetPin() { if(confirm("PIN 1234 ലേക്ക് മാറ്റണോ?")) { db.pin = "1234"; saveDB(); } }
        function toggleTheme() { db.darkMode = !db.darkMode; saveDB(); }

        function render() { 
            document.body.className = db.darkMode ? 'dark-mode' : 'light-mode';
            document.getElementById('themeIcon').className = db.darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            activeCid ? renderDetails() : renderHome(); 
        }

        function renderHome() {
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('custEditBtn').classList.add('hidden');
            document.getElementById('pageTitle').innerText = "KHATA PRO";
            renderPromises();
            let tg=0, tgo=0; db.trans.forEach(t => { if(t.type==='GAVE') tg+=t.amt; else tgo+=t.amt; });
            document.getElementById('topStatsArea').innerHTML = `<div class="mt-8 mb-4"><div class="stat-label-yellow">Net Balance</div><h2 class="main-balance-text">₹${(tg-tgo).toLocaleString()}</h2></div>`;
            document.getElementById('homeActions').innerHTML = `<button onclick="openAddQuick('GAVE')" class="action-oval-btn">Gave</button><button onclick="openAddQuick('GOT')" class="action-oval-btn">Got</button>`;
            document.getElementById('searchBox').innerHTML = `<input type="text" oninput="searchQuery=this.value;renderList()" placeholder="Search clients..." class="w-full bg-black/10 border border-white/10 p-5 rounded-2xl outline-none">`;
            renderList();
            document.getElementById('footerActions').innerHTML = `<button class="w-full p-5 btn-primary rounded-2xl font-black text-lg" onclick="openCustModal()"><i class="fa-solid fa-user-plus mr-2"></i> NEW CLIENT</button>`;
        }

        function renderPromises() {
            const today = new Date(); today.setHours(0,0,0,0); let h = "";
            db.promises.forEach(p => {
                const c = db.customers.find(x => x.id === p.cid); if(!c) return;
                const pDate = new Date(p.date); pDate.setHours(0,0,0,0);
                h += `<div class="p-4 rounded-2xl flex justify-between items-center mb-2 bg-white/5 border border-white/10 ${pDate <= today?'overdue-blink shadow-lg':''}" onclick="openCustomer(${c.id})"><div class="flex-1 text-left"><h3 class="font-bold text-sm">${c.name}: ₹${p.amt}</h3><p class="text-[10px]">Due: ${fmtDate(p.date)}</p></div><button onclick="event.stopPropagation();settlePromise(${p.id})" class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center"><i class="fa-solid fa-check text-white"></i></button></div>`;
            });
            document.getElementById('promiseHeader').innerHTML = h;
        }

        function settlePromise(id) { 
            const p = db.promises.find(x => x.id === id); 
            db.trans.push({id:Date.now(), cid:p.cid, type:'GOT', amt:Number(p.amt), date:getToday(), mode:'CASH', rem:'Promise Settled'}); 
            db.promises = db.promises.filter(x => x.id !== id); 
            saveDB(); 
        }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            if(!cust) { activeCid = null; render(); return; }
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = cust.name;
            document.getElementById('custEditBtn').classList.remove('hidden');
            document.getElementById('custEditBtn').onclick = () => openCustModal(cust.id);
            document.getElementById('promiseHeader').innerHTML = "";
            
            let rb = 0, mGave = 0, mGot = 0;
            const now = new Date();
            let trans = db.trans.filter(t => t.cid === activeCid).sort((a,b)=> new Date(a.date) - new Date(b.date));
            
            let rows = trans.map(t => {
                const tDate = new Date(t.date);
                if(tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear()) {
                    if(t.type === 'GAVE') mGave += t.amt; else mGot += t.amt;
                }
                rb += (t.type === 'GAVE' ? t.amt : -t.amt);
                const mTag = `<span class="mode-tag ${t.mode==='UPI'?'mode-upi':'mode-cash'}">${t.mode || 'CASH'}</span>`;

                return `<tr class="trans-row" onclick="openEditTrans(${t.id})">
                    <td class="opacity-60">${fmtDate(t.date)}</td>
                    <td class="text-yellow-500 font-medium">${t.rem || '-'}</td>
                    <td class="text-red-500 font-bold">₹${t.type==='GAVE'?t.amt:'-'}${t.type==='GAVE'?mTag:''}</td>
                    <td class="text-green-500 font-bold">₹${t.type==='GOT'?t.amt:'-'}${t.type==='GOT'?mTag:''}</td>
                    <td class="font-black">₹${rb}</td>
                </tr>`;
            }).reverse().join('');

            document.getElementById('topStatsArea').innerHTML = `
                <div class="bg-yellow-500 -mx-4 -mt-4 p-6 text-black shadow-2xl relative">
                    <div class="flex justify-center gap-5 mb-6">
                        <button onclick="shareWA('${cust.phone}', ${rb})" class="feature-icon-btn"><i class="fa-brands fa-whatsapp text-2xl text-green-800"></i></button>
                        <button onclick="openQR(${Math.abs(rb)})" class="feature-icon-btn"><i class="fa-solid fa-qrcode text-2xl text-purple-800"></i></button>
                        <button onclick="openPDFModal()" class="feature-icon-btn"><i class="fa-solid fa-file-pdf text-2xl text-blue-800"></i></button>
                        <button onclick="openPromiseModal()" class="feature-icon-btn"><i class="fa-solid fa-calendar-plus text-2xl text-orange-900"></i></button>
                    </div>
                    <p class="text-[11px] font-black opacity-60 uppercase mb-1">Total Balance</p>
                    <h2 class="text-5xl font-black mb-4">₹${Math.abs(rb)}</h2>
                    <div class="monthly-card-row">
                        <div class="monthly-item text-red-700"><p class="text-[9px] font-black">GAVE</p><p class="font-black">₹${mGave}</p></div>
                        <div class="monthly-item text-green-800"><p class="text-[9px] font-black">GOT</p><p class="font-black">₹${mGot}</p></div>
                        <div class="monthly-item"><p class="text-[9px] font-black opacity-60">NET</p><p class="font-black">₹${mGave - mGot}</p></div>
                    </div>
                </div>`;

            document.getElementById('mainContent').innerHTML = `<div class="mt-4 overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[10px] opacity-40 font-black border-b border-white/10"><th>DATE</th><th>REMARKS</th><th>GAVE</th><th>GOT</th><th>BAL</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-red-600 rounded-3xl font-black text-white" onclick="openAdd('GAVE')">GAVE</button><button class="flex-1 p-5 bg-green-600 rounded-3xl font-black text-white" onclick="openAdd('GOT')">GOT</button></div>`;
        }

        function renderList() {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
            let html = `<div class="space-y-3">`;
            filtered.forEach(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type==='GAVE' ? t.amt : -t.amt));
                html += `<div class="flex items-center p-4 rounded-2xl bg-white/5 border border-white/10" onclick="openCustomer(${c.id})"><div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-white text-lg">${c.name[0]}</div><div class="flex-1 ml-4"><p class="font-bold text-sm">${c.name}</p></div><div class="text-right"><p class="font-black text-sm ${bal>=0?'text-red-500':'text-green-500'}">₹${Math.abs(bal)}</p></div></div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        function openAdd(type) {
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="text-xl font-black mb-6 text-center text-white uppercase">${type}</h2>
                <input id="ta" type="number" class="w-full p-6 mb-4 rounded-3xl text-4xl text-center text-blue-600 bg-white" placeholder="₹ 0" autofocus>
                <div class="flex gap-2 mb-4">
                    <button id="mCash" onclick="setM('CASH')" class="flex-1 p-3 rounded-xl border-2 font-bold">CASH</button>
                    <button id="mUpi" onclick="setM('UPI')" class="flex-1 p-3 rounded-xl border-2 font-bold">UPI</button>
                </div>
                <input id="tr" type="text" class="w-full p-4 rounded-2xl mb-4 text-black" placeholder="Remarks (എന്തിനാണ്?)">
                <input id="td" type="date" class="w-full p-4 rounded-2xl mb-6 text-black" value="${getToday()}">
                <input type="hidden" id="tm" value="CASH">
                <button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="saveTrans('${type}')">SAVE TRANSACTION</button>
            `);
            setM('CASH');
        }

        function setM(m) {
            document.getElementById('tm').value = m;
            document.getElementById('mCash').className = m==='CASH' ? 'flex-1 p-3 rounded-xl border-yellow-500 bg-yellow-500 text-black font-bold' : 'flex-1 p-3 rounded-xl border-white/10 bg-white/5 font-bold';
            document.getElementById('mUpi').className = m==='UPI' ? 'flex-1 p-3 rounded-xl border-blue-500 bg-blue-500 text-white font-bold' : 'flex-1 p-3 rounded-xl border-white/10 bg-white/5 font-bold';
        }

        function saveTrans(type) {
            let a=Number(document.getElementById('ta').value), d=document.getElementById('td').value, r=document.getElementById('tr').value, m=document.getElementById('tm').value;
            if(a && d){ db.trans.push({id:Date.now(), cid:activeCid, type, amt:a, date:d, rem:r, mode:m}); saveDB(); closeModal(); }
        }

        function openQR(amt) {
            if(!db.upi) return alert("Settings-ൽ UPI ID നൽകുക");
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <div class="bg-white p-6 rounded-[2rem] flex flex-col items-center">
                    <div id="qr"></div>
                    <p class="text-black font-black mt-4 text-2xl">₹${amt}</p>
                    <p class="text-gray-500 text-[10px] mt-1">${db.upi}</p>
                    <button onclick="shareLink(${amt})" class="mt-4 w-full p-3 bg-blue-100 text-blue-700 rounded-xl font-bold text-sm"><i class="fa-solid fa-share-nodes mr-2"></i> SHARE LINK</button>
                </div>
            `);
            new QRCode(document.getElementById("qr"), { text: `upi://pay?pa=${db.upi}&am=${amt}&cu=INR`, width: 200, height: 200 });
        }

        function shareLink(amt) {
            const link = `upi://pay?pa=${db.upi}&am=${amt}&cu=INR`;
            if (navigator.share) {
                navigator.share({ title: 'Payment Link', text: `Pay ₹${amt}:`, url: link });
            } else {
                alert("Link: " + link);
            }
        }

        function shareWA(p, b) {
            if(!p) return alert("Phone Number ഇല്ല");
            const msg = `ബാലൻസ്: ₹${Math.abs(b)}. വേഗത്തിൽ തീർപ്പാക്കുമല്ലോ.`;
            window.open(`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`);
        }

        function openPromiseModal() {
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="text-xl font-black mb-6 text-center text-white">ADD PROMISE</h2>
                <input id="pa" type="number" class="w-full p-4 rounded-2xl mb-4 text-black" placeholder="Amount">
                <input id="pd" type="date" class="w-full p-4 rounded-2xl mb-6 text-black" value="${getToday()}">
                <button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="savePromise()">SET PROMISE</button>
            `);
        }
        function savePromise() { let a=document.getElementById('pa').value, d=document.getElementById('pd').value; if(a&&d){ db.promises.push({id:Date.now(), cid:activeCid, amt:a, date:d}); saveDB(); closeModal(); } }

        function openSettings() {
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="text-2xl font-black mb-6 text-center text-white">SETTINGS</h2>
                <input id="upiI" class="w-full p-4 rounded-2xl text-black mb-4" value="${db.upi||''}" placeholder="UPI ID">
                <input id="pinI" class="w-full p-4 rounded-2xl text-black mb-6" value="${db.pin}" placeholder="PIN">
                <button class="w-full p-5 btn-primary rounded-2xl font-black mb-8" onclick="db.upi=document.getElementById('upiI').value;db.pin=document.getElementById('pinI').value;saveDB();closeModal();">APPLY</button>
                <div class="grid grid-cols-2 gap-4">
                    <button class="p-4 bg-green-700 rounded-2xl text-xs font-bold text-white" onclick="exportData()">BACKUP</button>
                    <button class="p-4 bg-blue-700 rounded-2xl text-xs font-bold text-white" onclick="document.getElementById('imp').click()">RESTORE</button>
                </div>
                <input type="file" id="imp" class="hidden" onchange="importData(event)">
            `);
        }

        function exportData() { const blob=new Blob([JSON.stringify(db)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Khata_Backup.json`; a.click(); }
        function importData(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { try { db = JSON.parse(ev.target.result); saveDB(); location.reload(); } catch (err) { alert("Failed!"); } };
            reader.readAsText(file);
        }

        function openPDFModal() {
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="mb-4 font-bold">PDF Report</h2>
                <input id="ps" type="date" class="w-full p-4 rounded-xl text-black mb-2" value="2026-01-01">
                <input id="pe" type="date" class="w-full p-4 rounded-xl text-black mb-4" value="${getToday()}">
                <button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="generatePDF()">DOWNLOAD</button>
            `);
        }

        function generatePDF() {
            const s=document.getElementById('ps').value, e=document.getElementById('pe').value, cust=db.customers.find(c=>c.id===activeCid);
            const filtered=db.trans.filter(t=>t.cid===activeCid && t.date>=s && t.date<=e).sort((a,b)=>new Date(a.date)-new Date(b.date));
            const el=document.createElement('div'); el.style.padding="40px"; el.style.background="#fff"; el.style.color="#000";
            let rt=0;
            let rows=filtered.map(t=>{ rt+=(t.type==='GAVE'?t.amt:-t.amt); return `<tr><td style="border:1px solid #ddd;padding:12px">${fmtDate(t.date)}</td><td style="border:1px solid #ddd;padding:12px">${t.rem||'-'}</td><td style="border:1px solid #ddd;padding:12px;color:red">${t.type==='GAVE'?t.amt:'-'}</td><td style="border:1px solid #ddd;padding:12px;color:green">${t.type==='GOT'?t.amt:'-'}</td><td style="border:1px solid #ddd;padding:12px;font-weight:bold">₹${rt}</td></tr>`; }).join('');
            el.innerHTML=`<h2 style="text-align:center">KHATA PRO - ${cust.name}</h2><table style="width:100%;border-collapse:collapse;margin-top:20px"><thead><tr style="background:#eee"><th>Date</th><th>Remarks</th><th>Gave</th><th>Got</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
            html2pdf().from(el).save(`${cust.name}_Report.pdf`);
        }

        function openCustomer(id) { activeCid = id; render(); }
        function goHome() { activeCid = null; render(); }
        function openEditTrans(tid) {
            const t = db.trans.find(x => x.id === tid);
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="text-xl font-black mb-6 text-center text-white">EDIT</h2>
                <input id="eta" type="number" class="w-full p-6 mb-4 rounded-3xl text-3xl text-center text-blue-600 bg-white" value="${t.amt}">
                <input id="etr" type="text" class="w-full p-4 rounded-2xl mb-4 text-black" value="${t.rem || ''}">
                <input id="etd" type="date" class="w-full p-4 rounded-2xl mb-6 text-black" value="${t.date}">
                <button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="updateTrans(${tid})">UPDATE</button>
                <button class="w-full p-4 bg-red-600 rounded-2xl mt-3 font-black text-white" onclick="deleteTrans(${tid})">DELETE</button>
            `);
        }
        function updateTrans(tid) { const t=db.trans.find(x=>x.id===tid); t.amt=Number(document.getElementById('eta').value); t.rem=document.getElementById('etr').value; t.date=document.getElementById('etd').value; saveDB(); closeModal(); }
        function deleteTrans(tid) { if(confirm("Delete?")) { db.trans=db.trans.filter(x=>x.id!==tid); saveDB(); closeModal(); } }

        function openCustModal(cid=null) {
            const c = cid ? db.customers.find(x=>x.id===cid) : {name:'', phone:''};
            openModal(`
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="text-xl font-black mb-6 text-center text-white">${cid?'EDIT':'NEW'} CLIENT</h2>
                <input id="cn" class="w-full p-4 rounded-2xl mb-4 text-black" placeholder="Name" value="${c.name}">
                <input id="cp" type="number" class="w-full p-4 rounded-2xl mb-6 text-black" placeholder="Phone Number" value="${c.phone}">
                <button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="saveCust(${cid})">SAVE</button>
                ${cid ? `<button class="w-full p-4 bg-red-900 rounded-2xl mt-4 font-black text-white text-xs" onclick="deleteFullCust(${cid})">DELETE FULL HISTORY</button>` : ''}
            `);
        }
        function saveCust(cid) { let n=document.getElementById('cn').value; if(n){ if(cid){ let c=db.customers.find(x=>x.id===cid); c.name=n; c.phone=document.getElementById('cp').value; }else{ db.customers.push({id:Date.now(), name:n, phone:document.getElementById('cp').value}); } saveDB(); closeModal(); } }
        function deleteFullCust(cid) { if(confirm("Delete customer?")) { db.customers=db.customers.filter(x=>x.id!==cid); db.trans=db.trans.filter(x=>x.cid!==cid); activeCid=null; saveDB(); closeModal(); } }

        function openAddQuick(type) { 
            let options = db.customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if(!options) return alert("Add client first");
            openModal(`<button class="close-btn" onclick="closeModal()">&times;</button><h2 class="text-xl font-black mb-6 text-center text-white uppercase">QUICK ${type}</h2><select id="q_cid" class="w-full p-4 rounded-2xl mb-4 text-black">${options}</select><input id="q_amt" type="number" class="w-full p-6 mb-6 rounded-3xl text-4xl text-center text-blue-600 bg-white" placeholder="₹ 0"><button class="w-full p-5 btn-primary rounded-2xl font-black" onclick="saveQuick('${type}')">SAVE</button>`);
        }
        function saveQuick(type) { let cid=Number(document.getElementById('q_cid').value), a=Number(document.getElementById('q_amt').value); if(cid&&a){ db.trans.push({id:Date.now(), cid, type, amt:a, date:getToday(), mode:'CASH'}); saveDB(); closeModal(); } }

        function openModal(h) { document.getElementById('modalBox').innerHTML=h; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }

        window.onload = () => { lockApp(); };
    </script>

    <div id="modalOverlay" class="fixed inset-0 bg-black/80 hidden z-[1000] items-end justify-center p-4" onclick="closeModal()">
        <div id="modalBox" class="w-full max-w-[420px] bg-[#161b2e] p-6 rounded-t-[3rem] text-white overflow-y-auto max-h-[85vh] relative" onclick="event.stopPropagation()"></div>
    </div>
</body>
</html>
