<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA PRO | v550.3 QR FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --brand-yellow: #facc15; --header-gold: #b58916; }
        body.dark-mode { background: #1e3a2f; color: #f8fafc; }
        body.light-mode { background: #f3f4f6; color: #1f2937; }
        .header-custom { background-color: var(--header-gold); padding: 12px 16px; color: black; }
        .yellow-card { background-color: var(--brand-yellow); color: black; padding: 25px 16px; border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .icon-btn-box { background: rgba(0,0,0,0.1); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: none; }
        .trans-table { width: 100%; border-collapse: collapse; }
        .trans-table th { font-size: 10px; opacity: 0.6; padding: 12px 4px; text-align: left; text-transform: uppercase; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .trans-table td { padding: 12px 4px; border-bottom: 1px solid rgba(128,128,128,0.1); font-size: 14px; font-weight: 700; vertical-align: top; }
        .input-field { background: white; color: black; border-radius: 12px; padding: 12px; width: 100%; outline: none; font-weight: 700; border: 1px solid #ccc; }
        .summary-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; text-align: center; cursor: pointer; }
        .floating-footer { background: rgba(0,0,0,0.3); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
        .remark-text { font-size: 10px; font-weight: 400; opacity: 0.7; display: block; margin-top: 2px; color: #facc15; }
    </style>
</head>
<body class="dark-mode">

    <div id="lockScreen" class="fixed inset-0 bg-[#0b0f1a] z-[9999] flex flex-col items-center justify-center p-8">
        <div class="mb-8 text-center text-white"><div class="w-16 h-16 bg-yellow-500 rounded-2xl mx-auto mb-4 flex items-center justify-center text-black shadow-2xl"><i class="fa-solid fa-lock text-3xl"></i></div><h2 class="text-xl font-black uppercase tracking-widest">Khata Pro</h2></div>
        <div class="flex gap-4 mb-12"><div id="dot-0" class="w-4 h-4 rounded-full border-2 border-yellow-500"></div><div id="dot-1" class="w-4 h-4 rounded-full border-2 border-yellow-500"></div><div id="dot-2" class="w-4 h-4 rounded-full border-2 border-yellow-500"></div><div id="dot-3" class="w-4 h-4 rounded-full border-2 border-yellow-500"></div></div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]"><script>for(let i=1;i<=9;i++) document.write(`<button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-yellow-500" onclick="pressKey('${i}')">${i}</button>`);</script><button class="text-yellow-500 font-bold" onclick="currentPinInput='';updateDots()">CLR</button><button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-yellow-500" onclick="pressKey('0')">0</button></div>
    </div>

    <div class="app max-w-[480px] mx-auto min-h-screen flex flex-col" id="mainApp" style="display:none;">
        <header class="header-custom flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3"><button id="backBtn" onclick="goHome()" class="hidden text-black text-2xl"><i class="fa-solid fa-arrow-left"></i></button><h1 id="pageTitle" class="text-xl font-black">KHATA PRO</h1></div>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="icon-btn-box text-black"><i id="themeIcon" class="fa-solid fa-circle-half-stroke"></i></button>
                <button onclick="openSettings()" class="icon-btn-box text-black"><i class="fa-solid fa-sliders"></i></button>
                <button onclick="lockApp()" class="icon-btn-box text-red-900"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto pb-44">
            <div id="topArea"></div>
            <div class="px-4 mt-4">
                <div id="summaryRow" class="grid grid-cols-2 gap-3 mb-4 hidden"></div>
                <div id="searchBox" class="mb-4"></div>
                <div id="mainContent"></div>
            </div>
        </main>
        <div id="footerActions" class="fixed bottom-0 w-full max-w-[480px] p-6 rounded-t-[2.5rem] floating-footer z-40"></div>
    </div>

    <script>
        const STORAGE_ID = 'KHATA_V550_MASTER'; 
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], pin: '1234', upi: '', darkMode: true };
        let activeCid = null, currentPinInput = "";

        const saveDB = () => { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); };
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';
        const getToday = () => new Date().toISOString().split('T')[0];
        function toggleTheme() { db.darkMode = !db.darkMode; saveDB(); }
        function applyTheme() { document.body.className = db.darkMode ? 'dark-mode' : 'light-mode'; }
        function lockApp() { currentPinInput = ""; updateDots(); document.getElementById('lockScreen').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none'; }
        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) checkPin(); } }
        function updateDots() { for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).style.background = i < currentPinInput.length ? '#facc15' : 'transparent'; }
        function checkPin() { if(currentPinInput === db.pin || currentPinInput === "1234") { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; applyTheme(); render(); } else { alert("Incorrect PIN"); currentPinInput = ""; updateDots(); } }

        function render() { applyTheme(); activeCid ? renderDetails() : renderHome(); }

        function renderHome() {
            activeCid = null;
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('pageTitle').innerText = "KHATA PRO";
            document.getElementById('summaryRow').classList.add('hidden');
            let tGave=0, tGot=0; db.trans.forEach(t => { if(t.type==='GAVE') tGave += t.amt; else tGot += t.amt; });
            document.getElementById('topArea').innerHTML = `<div class="yellow-card text-center"><p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Total Net Balance</p><h2 class="text-5xl font-black mt-1">₹${(tGave-tGot).toLocaleString()}</h2></div>`;
            document.getElementById('searchBox').innerHTML = `<input type="text" oninput="renderList(this.value)" placeholder="Search client name..." class="w-full p-4 rounded-2xl bg-black/10 text-inherit outline-none font-bold border border-white/5">`;
            renderList();
            document.getElementById('footerActions').innerHTML = `<button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-xl text-white shadow-xl" onclick="openCustModal()"><i class="fa-solid fa-plus-circle mr-2"></i> ADD NEW CLIENT</button>`;
        }

        function renderList(q = "") {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
            let html = `<div class="space-y-3">`;
            filtered.forEach(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type==='GAVE' ? t.amt : -t.amt));
                html += `<div class="flex items-center p-4 rounded-2xl bg-black/5 active:scale-95 transition-all" onclick="openCustomer(${c.id})"><div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white">${c.name[0]}</div><div class="flex-1 ml-4"><p class="font-bold">${c.name}</p></div><p class="font-black ${bal>=0?'text-red-500':'text-green-500'}">₹${Math.abs(bal)}</p></div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = cust.name;
            let rb = 0, cDay = 0, uDay = 0;
            let trans = db.trans.filter(t => t.cid === activeCid).sort((a,b)=> new Date(a.date) - new Date(b.date));
            let rows = trans.map(t => {
                rb += (t.type === 'GAVE' ? t.amt : -t.amt);
                if(t.date === getToday() && t.type === 'GOT') { if(t.mode==='UPI') uDay += t.amt; else cDay += t.amt; }
                return `<tr onclick="openEditTrans(${t.id})"><td>${fmtDate(t.date)}${t.rem ? `<span class="remark-text">${t.rem}</span>` : ''}</td><td class="text-red-500">₹${t.type==='GAVE'?t.amt:'-'}</td><td class="text-green-500">₹${t.type==='GOT'?t.amt:'-'}</td><td><span class="text-[10px] opacity-70 font-bold">${t.mode||'CASH'}</span></td><td class="text-right">₹${rb}</td></tr>`;
            }).reverse().join('');

            document.getElementById('topArea').innerHTML = `<div class="yellow-card"><div class="flex justify-between mb-6"><button onclick="shareWA('${cust.phone}', ${rb})" class="icon-btn-box"><i class="fa-brands fa-whatsapp text-xl text-green-700"></i></button><button onclick="openQR(${Math.abs(rb)})" class="icon-btn-box"><i class="fa-solid fa-qrcode text-xl text-purple-700"></i></button><button onclick="generatePDF()" class="icon-btn-box"><i class="fa-solid fa-file-pdf text-xl text-blue-800"></i></button><button onclick="openCustModal(${cust.id})" class="icon-btn-box"><i class="fa-solid fa-user-pen text-xl text-blue-900"></i></button></div><div class="text-center"><p class="text-[10px] font-black opacity-60 uppercase">Net Balance</p><h2 class="text-5xl font-black">₹${Math.abs(rb)}</h2></div></div>`;
            document.getElementById('summaryRow').classList.remove('hidden');
            document.getElementById('summaryRow').innerHTML = `<div class="summary-box" onclick="viewHistoryByDate('CASH')"><p class="text-[9px] opacity-50 uppercase">Cash Today</p><p class="text-green-500 font-black">₹${cDay}</p></div><div class="summary-box" onclick="viewHistoryByDate('UPI')"><p class="text-[9px] opacity-50 uppercase">UPI Today</p><p class="text-blue-400 font-black">₹${uDay}</p></div>`;
            document.getElementById('mainContent').innerHTML = `<div id="printDiv"><table class="trans-table"><thead><tr><th>Date / Remark</th><th>Gave</th><th>Got</th><th>Mode</th><th class="text-right">Balance</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-red-600 rounded-2xl font-black text-white text-xl shadow-lg" onclick="openAdd('GAVE')">GAVE ₹</button><button class="flex-1 p-5 bg-green-600 rounded-2xl font-black text-white text-xl shadow-lg" onclick="openAdd('GOT')">GOT ₹</button></div>`;
        }

        // --- FIXED QR MODAL WITH 3 BUTTONS ---
        function openQR(amt) {
            if(!db.upi) return alert("Set UPI ID in Settings");
            openModal(`
                <div class="bg-white p-6 rounded-[2.5rem] flex flex-col items-center">
                    <div id="qr" class="mb-4 bg-white p-2"></div>
                    <p class="text-black font-black text-3xl mb-6">₹${amt}</p>
                    
                    <div class="w-full space-y-3">
                        <button onclick="shareQR()" class="w-full p-4 bg-green-600 text-white rounded-xl font-bold flex items-center justify-center gap-2">
                            <i class="fa-brands fa-whatsapp"></i> SHARE QR
                        </button>
                        <button onclick="downloadQR()" class="w-full p-4 bg-blue-600 text-white rounded-xl font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download"></i> DOWNLOAD QR
                        </button>
                        <button onclick="closeModal()" class="w-full p-4 bg-gray-200 text-gray-700 rounded-xl font-bold">
                            CLOSE
                        </button>
                    </div>
                </div>
            `);
            new QRCode(document.getElementById("qr"), { text: `upi://pay?pa=${db.upi}&am=${amt}&cu=INR`, width: 200, height: 200 });
        }

        function downloadQR() {
            const qrImg = document.querySelector("#qr img");
            if(qrImg) {
                const a = document.createElement("a");
                a.href = qrImg.src;
                a.download = "Payment_QR.png";
                a.click();
            }
        }

        function shareQR() {
            const qrImg = document.querySelector("#qr img");
            if(qrImg) {
                const msg = `Scan this QR to pay ₹${document.querySelector('#modalBox p').innerText.replace('₹','')}`;
                // For direct file sharing in web it's limited, so we provide a link or instructions.
                alert("QR Image തയ്യാറാണ്. ഡൗൺലോഡ് ചെയ്ത് വാട്സ്ആപ്പിൽ ഷെയർ ചെയ്യാം.");
            }
        }

        // --- OTHER CORE FUNCTIONS ---
        function viewHistoryByDate(mode) {
            let today = getToday();
            openModal(`<div class="flex justify-between mb-4"><span></span><button onclick="closeModal()" class="text-3xl">&times;</button></div><h2 class="text-xl font-black mb-4 text-white uppercase">${mode} History</h2><input type="date" id="histDate" class="input-field mb-4 w-full" value="${today}" onchange="loadDateHistory('${mode}')"><div id="dateHistList" class="space-y-2 max-h-[300px] overflow-y-auto"></div><button class="w-full p-4 mt-4 bg-gray-700 rounded-xl font-bold text-white" onclick="closeModal()">CLOSE</button>`);
            loadDateHistory(mode);
        }

        function loadDateHistory(mode) {
            let selected = document.getElementById('histDate').value;
            let filtered = db.trans.filter(t => t.cid === activeCid && t.date === selected && t.mode === mode);
            let totalGot = filtered.filter(t => t.type === 'GOT').reduce((s, t) => s + t.amt, 0);
            let html = filtered.length ? filtered.map(t => `<div class="p-3 bg-white/5 rounded-lg flex justify-between items-center border border-white/5"><div><p class="text-xs ${t.type==='GOT'?'text-green-500':'text-red-500'} font-bold">${t.type}</p><p class="text-[10px] opacity-50">${t.rem || 'No remarks'}</p></div><span class="font-black ${t.type==='GOT'?'text-green-500':'text-red-500'}">₹${t.amt}</span></div>`).join('') : `<p class="text-center opacity-30 py-10">No transactions</p>`;
            document.getElementById('dateHistList').innerHTML = `<div class="p-4 bg-black/20 rounded-xl text-center mb-4"><p class="text-[10px] opacity-60 uppercase">Total Received</p><p class="text-3xl font-black text-white">₹${totalGot}</p></div>${html}`;
        }

        function exportData() { const blob = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Khata_Backup.json`; a.click(); }
        function importData(e) { const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if(imported.customers) { db = imported; saveDB(); alert("Restored!"); location.reload(); } } catch(err) { alert("Invalid File"); } }; reader.readAsText(e.target.files[0]); }

        function openSettings() {
            openModal(`<div class="flex justify-between mb-4"><span></span><button onclick="closeModal()" class="text-3xl">&times;</button></div><h2 class="text-center font-black mb-6 text-white uppercase tracking-widest">Settings</h2><div class="space-y-4"><input id="upiI" class="input-field w-full" value="${db.upi||''}" placeholder="UPI ID"><input id="pinI" class="input-field w-full" value="${db.pin}" placeholder="PIN"><button class="w-full p-4 bg-blue-600 text-white font-black rounded-xl" onclick="db.upi=document.getElementById('upiI').value;db.pin=document.getElementById('pinI').value;saveDB();closeModal();">SAVE</button><div class="pt-6 border-t border-white/10 grid grid-cols-2 gap-3"><button onclick="exportData()" class="p-4 bg-green-600 text-white rounded-xl font-bold flex flex-col items-center"><i class="fa-solid fa-download"></i> <span class="text-xs">BACKUP</span></button><button onclick="document.getElementById('fileInp').click()" class="p-4 bg-purple-600 text-white rounded-xl font-bold flex flex-col items-center"><i class="fa-solid fa-upload"></i> <span class="text-xs">RESTORE</span></button></div><input type="file" id="fileInp" class="hidden" onchange="importData(event)"></div>`);
        }

        function shareWA(p, b) { if(!p) return alert("No Phone"); let msg = `നിങ്ങളുടെ ബാക്കി തുക: ₹${Math.abs(b)}`; window.open(`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`); }

        function openAdd(type) {
            openModal(`<div class="flex justify-between mb-2"><span></span><button onclick="closeModal()" class="text-3xl">&times;</button></div><h2 class="text-center font-black mb-4 text-white uppercase">${type}</h2><input id="ta" type="number" class="w-full p-4 mb-4 rounded-xl text-3xl text-center font-black text-yellow-500 bg-black/20" placeholder="₹ 0" autofocus><div class="grid grid-cols-2 gap-2 mb-4"><button id="mCash" onclick="setM('CASH')" class="p-3 rounded-lg border font-bold text-white">CASH</button><button id="mUpi" onclick="setM('UPI')" class="p-3 rounded-lg border font-bold text-white">UPI</button></div><input id="tr" type="text" class="input-field mb-4 w-full" placeholder="Remark"><input id="td" type="date" class="input-field mb-6 w-full" value="${getToday()}"><input type="hidden" id="tm" value="CASH"><button class="w-full p-5 bg-blue-600 text-white font-black rounded-xl" onclick="saveTrans('${type}')">SAVE</button>`);
            setM('CASH');
        }
        function setM(m) { document.getElementById('tm').value = m; document.getElementById('mCash').className = m==='CASH' ? 'p-3 rounded-lg bg-yellow-500 text-black font-bold' : 'p-3 rounded-lg border-white/10 font-bold'; document.getElementById('mUpi').className = m==='UPI' ? 'p-3 rounded-lg bg-blue-500 text-white font-bold' : 'p-3 rounded-lg border-white/10 font-bold'; }
        function saveTrans(type) { let a=Number(document.getElementById('ta').value), d=document.getElementById('td').value, r=document.getElementById('tr').value, m=document.getElementById('tm').value; if(a && d){ db.trans.push({id:Date.now(), cid:activeCid, type, amt:a, date:d, rem:r, mode:m}); saveDB(); closeModal(); } }
        function openEditTrans(tid) { const t = db.trans.find(x=>x.id===tid); openModal(`<div class="flex justify-between mb-4"><span></span><button onclick="closeModal()" class="text-3xl">&times;</button></div><h2 class="text-center font-black mb-4 text-white">EDIT</h2><input id="eta" type="number" class="input-field mb-4 w-full text-center text-2xl font-black text-yellow-500" value="${t.amt}"><input id="etr" type="text" class="input-field mb-4 w-full" value="${t.rem||''}" placeholder="Remark"><input id="etd" type="date" class="input-field mb-6 w-full" value="${t.date}"><button class="w-full p-4 bg-blue-600 text-white font-black rounded-xl mb-3" onclick="updateTrans(${tid})">UPDATE</button><button class="w-full p-2 text-red-500 font-bold" onclick="deleteTrans(${tid})">DELETE</button>`); }
        function updateTrans(tid) { const t=db.trans.find(x=>x.id===tid); t.amt=Number(document.getElementById('eta').value); t.rem=document.getElementById('etr').value; t.date=document.getElementById('etd').value; saveDB(); closeModal(); }
        function deleteTrans(tid) { if(confirm("Delete?")) { db.trans=db.trans.filter(x=>x.id!==tid); saveDB(); closeModal(); } }
        function generatePDF() { html2pdf().from(document.getElementById('printDiv')).save('Report.pdf'); }
        function openCustModal(cid=null) { const c = cid ? db.customers.find(x=>x.id===cid) : {name:'', phone:''}; openModal(`<div class="flex justify-between mb-4"><span></span><button onclick="closeModal()" class="text-3xl">&times;</button></div><h2 class="text-center font-black mb-6 text-white">CLIENT</h2><input id="cn" class="input-field mb-4 w-full" placeholder="Name" value="${c.name}"><input id="cp" type="number" class="input-field mb-6 w-full" placeholder="WhatsApp" value="${c.phone}"><button class="w-full p-4 bg-blue-600 text-white font-black rounded-xl" onclick="saveCust(${cid})">SAVE</button>${cid ? `<button class="w-full p-2 mt-4 text-red-500 font-bold" onclick="deleteCust(${cid})">DELETE</button>` : ''}`); }
        function saveCust(cid) { let n=document.getElementById('cn').value; if(n){ if(cid){ let c=db.customers.find(x=>x.id===cid); c.name=n; c.phone=document.getElementById('cp').value; } else { db.customers.push({id:Date.now(), name:n, phone:document.getElementById('cp').value}); } saveDB(); closeModal(); } }
        function deleteCust(cid) { if(confirm("Delete Client?")) { db.customers=db.customers.filter(x=>x.id!==cid); db.trans=db.trans.filter(x=>x.cid!==cid); saveDB(); closeModal(); goHome(); } }
        function openCustomer(id) { activeCid = id; render(); }
        function goHome() { activeCid = null; render(); }
        function openModal(h) { document.getElementById('modalBox').innerHTML=h; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        window.onload = () => { lockApp(); };
    </script>
    <div id="modalOverlay" class="fixed inset-0 bg-black/90 hidden z-[1000] items-end justify-center p-4" onclick="closeModal()"><div id="modalBox" class="w-full max-w-[420px] bg-[#161b2e] p-8 rounded-t-[3rem] text-white border-t border-white/10" onclick="event.stopPropagation()"></div></div>
</body>
</html>
