<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA PRO | v560 COMPLETE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --brand-yellow: #facc15; --header-gold: #b58916; --bg-dark-green: #1a3c30; }
        body.dark-mode { background: var(--bg-dark-green); color: #f8fafc; }
        body.dark-mode .card-bg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        body.light-mode { background: #f1f5f9; color: #0f172a; }
        body.light-mode .card-bg { background: white; border: 1px solid #e2e8f0; }
        .header-custom { background-color: var(--header-gold); padding: 12px 16px; color: black; position: sticky; top: 0; z-index: 50; }
        .yellow-card-premium { background: linear-gradient(180deg, var(--brand-yellow) 0%, #eab308 100%); color: black; margin: -16px -16px 10px -16px; padding: 20px 16px; border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; }
        .trans-table td { padding: 12px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; font-weight: 700; }
        .mode-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: rgba(0,0,0,0.1); margin-left: 4px; }
    </style>
</head>
<body class="dark-mode">

    <div id="lockScreen" class="fixed inset-0 bg-[#0b0f1a] z-[9999] flex flex-col items-center justify-center p-8">
        <div class="mb-8 text-center text-white">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-2xl"><i class="fa-solid fa-lock text-4xl"></i></div>
            <h2 class="text-2xl font-black">Khata Pro</h2>
        </div>
        <div class="flex gap-4 mb-12">
            <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('${i}')">${i}</button>`);</script>
            <button class="text-blue-400 font-bold" onclick="currentPinInput='';updateDots()">CLR</button>
            <button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('0')">0</button>
            <button class="text-red-500 font-bold text-[10px]" onclick="resetPin()">RESET</button>
        </div>
    </div>

    <div class="app w-full max-w-[480px] mx-auto min-h-screen flex flex-col" id="mainApp" style="display:none;">
        <header class="header-custom flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button id="backBtn" onclick="goHome()" class="hidden text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="pageTitle" class="text-lg font-black truncate">KHATA PRO</h1>
            </div>
            <div class="flex gap-2">
                <button id="custEditBtn" onclick="openCustModal(activeCid)" class="hidden"><i class="fa-solid fa-user-pen"></i></button>
                <button onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <main class="flex-1 p-4 pb-44">
            <div id="topArea"></div>
            <div id="monthlyStats" class="mb-4"></div>
            <div id="mainContent"></div>
        </main>
        
        <div id="footerActions" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 bg-black/40 backdrop-blur-xl"></div>
    </div>

    <script>
        const STORAGE_ID = 'KHATA_V560_MASTER';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], pin: '1234', upi: '', darkMode: true };
        let activeCid = null, currentPinInput = "", searchQuery = "";

        const saveDB = () => { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';

        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) setTimeout(checkPin, 200); } }
        function updateDots() { for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).style.background = i < currentPinInput.length ? '#3b82f6' : 'transparent'; }
        function checkPin() { if(currentPinInput === db.pin || currentPinInput === "1234") { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; render(); } else { alert("തെറ്റായ പിൻ"); currentPinInput = ""; updateDots(); } }
        function resetPin() { if(confirm("പിൻ 1234 ലേക്ക് മാറ്റണോ?")) { db.pin = "1234"; saveDB(); } }

        function render() {
            document.body.className = db.darkMode ? 'dark-mode' : 'light-mode';
            if(activeCid) renderDetails(); else renderHome();
        }

        function renderHome() {
            activeCid = null;
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('custEditBtn').classList.add('hidden');
            document.getElementById('pageTitle').innerText = "KHATA PRO";
            document.getElementById('monthlyStats').innerHTML = "";
            
            let tGave=0, tGot=0;
            db.trans.forEach(t => { if(t.type==='GAVE') tGave += t.amt; else tGot += t.amt; });
            
            document.getElementById('topArea').innerHTML = `<div class="yellow-card-premium text-center"><p class="text-xs font-bold opacity-70">ആകെ ബാക്കി ലഭിക്കാനുള്ളത്</p><h2 class="text-4xl font-black">₹${(tGave-tGot).toFixed(2)}</h2></div><input type="text" oninput="searchQuery=this.value;renderList()" placeholder="തിരയുക..." class="w-full p-4 rounded-xl bg-white/10 mt-4 outline-none font-bold">`;
            renderList();
            document.getElementById('footerActions').innerHTML = `<button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-white" onclick="openCustModal()">പുതിയ കസ്റ്റമർ</button>`;
        }

        function renderList() {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
            document.getElementById('mainContent').innerHTML = filtered.map(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type==='GAVE' ? t.amt : -t.amt));
                return `<div class="flex items-center p-4 rounded-xl card-bg mb-3" onclick="openCustomer(${c.id})"><div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">${c.name[0]}</div><div class="flex-1 ml-3 font-bold">${c.name}</div><div class="${bal>=0?'text-red-500':'text-green-500'} font-black">₹${Math.abs(bal).toFixed(2)}</div></div>`;
            }).join('');
        }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('custEditBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = cust.name;

            let rb = 0, mGave = 0, mGot = 0;
            const thisMonth = new Date().getMonth();
            const thisYear = new Date().getFullYear();

            let rows = db.trans.filter(t => t.cid === activeCid).sort((a,b)=> new Date(a.date) - new Date(b.date)).map(t => {
                rb += (t.type === 'GAVE' ? t.amt : -t.amt);
                let d = new Date(t.date);
                if(d.getMonth() === thisMonth && d.getFullYear() === thisYear) {
                    if(t.type === 'GAVE') mGave += t.amt; else mGot += t.amt;
                }
                return `<tr onclick="openEditTrans(${t.id})"><td>${fmtDate(t.date)}<span class="mode-tag">${t.mode}</span><span class="rem-info">${t.rem||''}</span></td><td class="text-red-500">${t.type==='GAVE'?t.amt.toFixed(2):'-'}</td><td class="text-green-500">${t.type==='GOT'?t.amt.toFixed(2):'-'}</td><td class="text-right font-bold">₹${rb.toFixed(2)}</td></tr>`;
            }).reverse().join('');

            document.getElementById('topArea').innerHTML = `<div class="yellow-card-premium text-center"><p class="text-xs font-bold opacity-70">ബാക്കി തുക</p><h2 class="text-4xl font-black">₹${Math.abs(rb).toFixed(2)}</h2></div>`;
            document.getElementById('monthlyStats').innerHTML = `<div class="grid grid-cols-2 gap-2"><div class="card-bg p-3 rounded-xl text-center"><p class="text-[10px] uppercase opacity-50 font-bold">ഈ മാസം നൽകിയത്</p><p class="text-red-500 font-black">₹${mGave.toFixed(2)}</p></div><div class="card-bg p-3 rounded-xl text-center"><p class="text-[10px] uppercase opacity-50 font-bold">ഈ മാസം ലഭിച്ചത്</p><p class="text-green-500 font-black">₹${mGot.toFixed(2)}</p></div></div>`;
            document.getElementById('mainContent').innerHTML = `<table class="trans-table w-full"><thead><tr class="text-[10px] opacity-50 uppercase text-left"><th>Date</th><th>Gave</th><th>Got</th><th class="text-right">Bal</th></tr></thead><tbody>${rows}</tbody></table>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-red-600 rounded-3xl font-black text-white" onclick="openAdd('GAVE')">GAVE</button><button class="flex-1 p-5 bg-green-600 rounded-3xl font-black text-white" onclick="openAdd('GOT')">GOT</button></div>`;
        }

        function openAdd(type) {
            openModal(`
                <h2 class="text-xl font-black mb-4 text-center text-white uppercase">${type}</h2>
                <input id="ta" type="number" class="w-full p-4 mb-4 rounded-xl text-3xl text-center text-blue-600 font-bold" placeholder="₹ 0" autofocus>
                <div class="flex gap-2 mb-4">
                    <button id="mCash" onclick="setMode('CASH')" class="flex-1 p-3 rounded-xl bg-blue-600 font-bold text-white">CASH</button>
                    <button id="mUpi" onclick="setMode('UPI')" class="flex-1 p-3 rounded-xl bg-white/10 font-bold text-white">UPI</button>
                </div>
                <input id="tr" type="text" class="w-full p-4 rounded-xl mb-3 text-black font-bold" placeholder="Remarks">
                <input id="td" type="date" class="w-full p-4 rounded-xl mb-4 text-black font-bold" value="${getToday()}">
                <input type="hidden" id="tm" value="CASH">
                <button class="w-full p-4 bg-blue-600 rounded-xl font-black text-white" onclick="saveTrans('${type}')">സേവ് ചെയ്യുക</button>
            `);
        }

        function setMode(m) {
            document.getElementById('tm').value = m;
            document.getElementById('mCash').className = m === 'CASH' ? 'flex-1 p-3 rounded-xl bg-blue-600 font-bold text-white' : 'flex-1 p-3 rounded-xl bg-white/10 font-bold text-white';
            document.getElementById('mUpi').className = m === 'UPI' ? 'flex-1 p-3 rounded-xl bg-blue-600 font-bold text-white' : 'flex-1 p-3 rounded-xl bg-white/10 font-bold text-white';
        }

        function saveTrans(type) {
            let a = Number(document.getElementById('ta').value);
            let d = document.getElementById('td').value;
            let r = document.getElementById('tr').value;
            let m = document.getElementById('tm').value;
            if(a && d) { db.trans.push({ id: Date.now(), cid: activeCid, type, amt: a, date: d, rem: r, mode: m }); saveDB(); closeModal(); }
        }

        function openEditTrans(tid) {
            const t = db.trans.find(x => x.id === tid);
            openModal(`
                <h2 class="text-lg font-black mb-4 text-center text-white">എൻട്രി മാറ്റുക</h2>
                <input id="eta" type="number" class="w-full p-4 mb-3 rounded-xl text-2xl text-center text-blue-600 font-bold" value="${t.amt}">
                <input id="etd" type="date" class="w-full p-4 rounded-xl mb-4 text-black font-bold" value="${t.date}">
                <div class="flex gap-2 mb-4">
                    <button class="flex-1 p-4 bg-red-600 rounded-xl font-black text-white text-sm" onclick="deleteTrans(${tid})">DELETE</button>
                    <button class="flex-1 p-4 bg-blue-600 rounded-xl font-black text-white text-sm" onclick="updateTrans(${tid})">UPDATE</button>
                </div>
            `);
        }

        function updateTrans(tid) {
            const t = db.trans.find(x => x.id === tid);
            t.amt = Number(document.getElementById('eta').value);
            t.date = document.getElementById('etd').value;
            saveDB(); closeModal();
        }

        function deleteTrans(tid) { if(confirm("ഡിലീറ്റ് ചെയ്യണോ?")) { db.trans = db.trans.filter(x => x.id !== tid); saveDB(); closeModal(); } }

        function openCustModal(cid=null) {
            const c = cid ? db.customers.find(x=>x.id===cid) : {name:'', phone:''};
            openModal(`
                <h2 class="text-xl font-black mb-4 text-center text-white">${cid?'Edit':'പുതിയ'} കസ്റ്റമർ</h2>
                <input id="cn" class="w-full p-4 rounded-xl mb-3 text-black font-bold" placeholder="പേര്" value="${c.name}">
                <input id="cp" type="number" class="w-full p-4 rounded-xl mb-4 text-black font-bold" placeholder="ഫോൺ" value="${c.phone}">
                <button class="w-full p-4 bg-blue-600 rounded-xl font-black text-white mb-3" onclick="saveCust(${cid})">SAVE</button>
                ${cid ? `<button class="w-full p-4 bg-red-600/20 text-red-500 border border-red-600 rounded-xl font-bold" onclick="deleteCust(${cid})">DELETE CUSTOMER</button>` : ''}
            `);
        }

        function saveCust(cid) {
            let n = document.getElementById('cn').value;
            if(n) {
                if(cid) { let c = db.customers.find(x=>x.id===cid); c.name = n; c.phone = document.getElementById('cp').value; }
                else { db.customers.push({ id: Date.now(), name: n, phone: document.getElementById('cp').value }); }
                saveDB(); closeModal();
            }
        }

        function deleteCust(cid) { if(confirm("ഈ കസ്റ്റമറെ ഡിലീറ്റ് ചെയ്യണോ?")) { db.customers = db.customers.filter(x => x.id !== cid); db.trans = db.trans.filter(x => x.cid !== cid); saveDB(); closeModal(); goHome(); } }

        function openSettings() {
            openModal(`
                <h2 class="text-xl font-black mb-4 text-center text-white">SETTINGS</h2>
                <input id="upiI" class="w-full p-4 rounded-xl text-black mb-3 font-bold" value="${db.upi||''}" placeholder="UPI ID">
                <input id="pinI" class="w-full p-4 rounded-xl text-black mb-4 font-bold" value="${db.pin}" placeholder="PIN">
                <button class="w-full p-4 bg-blue-600 rounded-xl font-bold text-white mb-4" onclick="db.upi=document.getElementById('upiI').value;db.pin=document.getElementById('pinI').value;saveDB();closeModal();">UPDATE</button>
                <button class="w-full p-4 bg-red-600 text-white font-black rounded-xl" onclick="clearAllData()">CLEAR ALL DATA</button>
            `);
        }

        function clearAllData() { if(confirm("എല്ലാ ഡാറ്റയും മായ്ക്കണോ?")) { db.customers = []; db.trans = []; saveDB(); closeModal(); } }
        function openCustomer(id) { activeCid = id; render(); }
        function goHome() { activeCid = null; render(); }
        function openModal(h) { document.getElementById('modalBox').innerHTML=h; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        window.onload = () => { document.getElementById('lockScreen').style.display = 'flex'; };
    </script>

    <div id="modalOverlay" class="fixed inset-0 bg-black/80 hidden z-[1000] items-end justify-center p-4" onclick="closeModal()">
        <div id="modalBox" class="w-full max-w-[420px] bg-[#161b2e] p-5 rounded-t-3xl text-white overflow-y-auto max-h-[85vh]" onclick="event.stopPropagation()"></div>
    </div>
</body>
</html>
