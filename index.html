<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA PRO | v550</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        :root { 
            --brand-yellow: #facc15; 
            --header-gold: #b58916; 
            --bg-dark-green: #1a3c30; 
        }
        
        body.dark-mode { background: var(--bg-dark-green); color: #f8fafc; }
        body.dark-mode .card-bg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        body.dark-mode .input-field { background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); }
        
        body.light-mode { background: #f1f5f9; color: #0f172a; }
        body.light-mode .card-bg { background: white; border: 1px solid #e2e8f0; color: #0f172a; }
        body.light-mode .input-field { background: white; color: black; border: 1px solid #cbd5e1; }

        .header-custom { background-color: var(--header-gold); padding: 12px 16px; color: black; }
        .icon-btn-box { background: rgba(0,0,0,0.1); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: none; }
        
        .yellow-card-premium { 
            background: linear-gradient(180deg, var(--brand-yellow) 0%, #eab308 100%); 
            color: black; 
            margin: -16px -16px 20px -16px; 
            padding: 24px 16px; 
            border-bottom-left-radius: 3rem; 
            border-bottom-right-radius: 3rem; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
        }
        
        .summary-box { 
            background: rgba(0,0,0,0.05); 
            border-radius: 1.5rem; 
            padding: 16px; 
            display: flex; 
            justify-content: space-between; 
            margin-top: 20px;
        }
        .summary-item { text-align: center; flex: 1; }
        .summary-label { font-size: 10px; font-weight: 800; opacity: 0.6; text-transform: uppercase; margin-bottom: 4px; }
        .summary-value { font-size: 18px; font-weight: 900; }
        .summary-divider { width: 1px; background: rgba(0,0,0,0.1); margin: 0 10px; }

        .trans-table { width: 100%; border-collapse: collapse; }
        .trans-table th { font-size: 10px; opacity: 0.6; padding: 12px 4px; text-align: left; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .trans-table td { padding: 16px 4px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 15px; font-weight: 700; }
        
        .rem-info { font-size: 11px; color: #b58916; display: block; font-weight: 600; margin-top: 2px; }
        .mode-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.05); font-weight: 800; }
    </style>
</head>
<body class="dark-mode">

    <div id="lockScreen" class="fixed inset-0 bg-[#0b0f1a] z-[9999] flex flex-col items-center justify-center p-8">
        <div class="mb-8 text-center text-white">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-2xl"><i class="fa-solid fa-lock text-4xl"></i></div>
            <h2 class="text-2xl font-black uppercase tracking-widest">Khata Pro</h2>
        </div>
        <div class="flex gap-4 mb-12">
            <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('${i}')">${i}</button>`);</script>
            <button class="text-blue-400 font-bold" onclick="currentPinInput='';updateDots()">CLR</button>
            <button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('0')">0</button>
            <button class="text-red-500 font-bold text-[10px]" onclick="resetPin()">RESET</button>
        </div>
    </div>

    <div class="app max-w-[480px] mx-auto min-h-screen flex flex-col" id="mainApp" style="display:none;">
        <header class="header-custom flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <button id="backBtn" onclick="goHome()" class="hidden text-black text-2xl"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="pageTitle" onclick="handleTitleClick()" class="text-xl font-black">KHATA PRO</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="icon-btn-box text-black"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
                <button onclick="lockApp()" class="icon-btn-box text-red-900"><i class="fa-solid fa-lock"></i></button>
                <button id="custEditBtn" class="hidden icon-btn-box text-blue-900"><i class="fa-solid fa-user-pen"></i></button>
                <button onclick="openSettings()" class="icon-btn-box text-black"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 pb-44">
            <div id="promiseHeader" class="mb-4 space-y-2"></div>
            <div id="topArea"></div>
            <div id="dailyRow" class="grid grid-cols-2 gap-3 mb-4 hidden"></div>
            <div id="searchBox" class="mb-4"></div>
            <div id="mainContent"></div>
        </main>
        
        <div id="footerActions" class="fixed bottom-0 w-full max-w-[480px] p-6 rounded-t-[2.5rem] bg-black/40 backdrop-blur-xl"></div>
    </div>

    <script>
        const STORAGE_ID = 'KHATA_V550_MASTER';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], promises: [], pin: '1234', upi: '', darkMode: true };
        let activeCid = null, currentPinInput = "", searchQuery = "";

        const saveDB = () => { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';
        
        function toggleTheme() { db.darkMode = !db.darkMode; saveDB(); }
        function lockApp() { currentPinInput = ""; updateDots(); document.getElementById('lockScreen').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none'; }
        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) setTimeout(checkPin, 200); } }
        function updateDots() { for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).style.background = i < currentPinInput.length ? '#3b82f6' : 'transparent'; }
        function checkPin() { if(currentPinInput === db.pin || currentPinInput === "1234") { document.getElementById('lockScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex'; render(); } else { alert("Wrong PIN"); currentPinInput = ""; updateDots(); } }
        function resetPin() { if(confirm("Reset PIN to 1234?")) { db.pin = "1234"; saveDB(); } }

        function render() { 
            document.body.className = db.darkMode ? 'dark-mode' : 'light-mode';
            document.getElementById('themeIcon').className = db.darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            activeCid ? renderDetails() : renderHome(); 
        }

        function handleTitleClick() { if(activeCid) openCustModal(activeCid); }

        function renderHome() {
            activeCid = null;
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('custEditBtn').classList.add('hidden');
            document.getElementById('dailyRow').classList.add('hidden');
            document.getElementById('pageTitle').innerText = "KHATA PRO";
            renderPromises();
            
            let tGave=0, tGot=0; db.trans.forEach(t => { if(t.type==='GAVE') tGave += t.amt; else tGot += t.amt; });

            document.getElementById('topArea').innerHTML = `
                <div class="yellow-card-premium text-center">
                    <p class="text-[11px] font-extrabold opacity-60 uppercase">Net Balance</p>
                    <h2 class="text-5xl font-black mt-2">₹${(tGave-tGot).toFixed(2)}</h2>
                </div>`;
            
            document.getElementById('searchBox').innerHTML = `<input type="text" oninput="searchQuery=this.value;renderList()" placeholder="Search clients..." class="input-field w-full p-5 rounded-2xl outline-none font-bold">`;
            renderList();
            document.getElementById('footerActions').innerHTML = `<button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-xl text-white shadow-xl" onclick="openCustModal()"><i class="fa-solid fa-user-plus mr-2"></i> NEW CLIENT</button>`;
        }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            if(!cust) { renderHome(); return; }
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('custEditBtn').classList.remove('hidden');
            document.getElementById('dailyRow').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = cust.name;
            document.getElementById('custEditBtn').onclick = () => openCustModal(activeCid);
            
            let rb = 0, cToday = 0, uToday = 0, mGave = 0, mGot = 0;
            const today = getToday(), now = new Date();
            let trans = db.trans.filter(t => t.cid === activeCid).sort((a,b)=> new Date(a.date) - new Date(b.date));
            
            let rows = trans.map(t => {
                const d = new Date(t.date);
                rb += (t.type === 'GAVE' ? t.amt : -t.amt);
                if(d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) { if(t.type==='GAVE') mGave += t.amt; else mGot += t.amt; }
                if(t.date === today && t.type === 'GOT') { if(t.mode==='UPI') uToday += t.amt; else cToday += t.amt; }
                
                return `<tr onclick="openEditTrans(${t.id})">
                    <td>${fmtDate(t.date)} <span class="rem-info">${t.rem || ''}</span></td>
                    <td class="text-red-500">₹${t.type==='GAVE'?t.amt.toFixed(2):'-'}</td>
                    <td class="text-green-500">₹${t.type==='GOT'?t.amt.toFixed(2):'-'}</td>
                    <td><span class="mode-badge ${t.mode==='UPI'?'text-blue-500':'text-green-600'}">${t.mode || 'CASH'}</span></td>
                    <td class="text-right">₹${rb.toFixed(2)}</td>
                </tr>`;
            }).reverse().join('');

            document.getElementById('topArea').innerHTML = `
                <div class="yellow-card-premium">
                    <div class="flex justify-between gap-3 mb-6">
                        <button onclick="shareWA('${cust.phone}', ${rb.toFixed(2)})" class="flex-1 bg-black/10 h-12 rounded-xl flex items-center justify-center"><i class="fa-brands fa-whatsapp text-2xl text-green-800"></i></button>
                        <button onclick="openQR(${Math.abs(rb).toFixed(2)})" class="flex-1 bg-black/10 h-12 rounded-xl flex items-center justify-center"><i class="fa-solid fa-qrcode text-2xl text-purple-800"></i></button>
                        <button onclick="openPDFModal()" class="flex-1 bg-black/10 h-12 rounded-xl flex items-center justify-center"><i class="fa-solid fa-file-pdf text-2xl text-blue-800"></i></button>
                        <button onclick="openPromiseModal()" class="flex-1 bg-black/10 h-12 rounded-xl flex items-center justify-center"><i class="fa-solid fa-calendar-check text-2xl text-orange-900"></i></button>
                    </div>
                    <div class="text-center mb-6">
                        <p class="text-[10px] font-black opacity-60 uppercase">Total Balance</p>
                        <h2 class="text-5xl font-black">₹${Math.abs(rb).toFixed(2)}</h2>
                    </div>
                    <div class="summary-box">
                        <div class="summary-item">
                            <p class="summary-label">Monthly Gave</p>
                            <p class="summary-value text-red-600">₹${mGave.toFixed(2)}</p>
                        </div>
                        <div class="summary-divider"></div>
                        <div class="summary-item">
                            <p class="summary-label">Monthly Got</p>
                            <p class="summary-value text-green-800">₹${mGot.toFixed(2)}</p>
                        </div>
                        <div class="summary-divider"></div>
                        <div class="summary-item">
                            <p class="summary-label">Monthly Total</p>
                            <p class="summary-value text-white">₹${(mGave - mGot).toFixed(2)}</p>
                        </div>
                    </div>
                </div>`;

            document.getElementById('dailyRow').innerHTML = `
                <div class="card-bg p-4 rounded-2xl text-center"><p class="text-[9px] font-black opacity-60">CASH TODAY</p><p class="text-green-500 font-black">₹${cToday.toFixed(2)}</p></div>
                <div class="card-bg p-4 rounded-2xl text-center"><p class="text-[9px] font-black opacity-60">UPI TODAY</p><p class="text-blue-500 font-black">₹${uToday.toFixed(2)}</p></div>
            `;

            document.getElementById('mainContent').innerHTML = `<table class="trans-table"><thead><tr><th>Date</th><th>Gave</th><th>Got</th><th>Method</th><th class="text-right">Bal</th></tr></thead><tbody>${rows}</tbody></table>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-red-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAdd('GAVE')">GAVE</button><button class="flex-1 p-5 bg-green-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAdd('GOT')">GOT</button></div>`;
        }

        function renderList() {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
            let html = `<div class="space-y-3">`;
            filtered.forEach(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type==='GAVE' ? t.amt : -t.amt));
                html += `<div class="flex items-center p-4 rounded-2xl card-bg" onclick="openCustomer(${c.id})"><div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">${c.name[0]}</div><div class="flex-1 ml-4"><p class="font-bold text-lg">${c.name}</p></div><div class="text-right"><p class="font-black text-lg ${bal>=0?'text-red-500':'text-green-500'}">₹${Math.abs(bal).toFixed(2)}</p></div></div>`;
            });
            document.getElementById('mainContent').innerHTML = html + `</div>`;
        }

        function renderPromises() {
            let h = "";
            db.promises.forEach(p => {
                const c = db.customers.find(x => x.id === p.cid); if(!c) return;
                h += `<div class="p-4 rounded-2xl flex justify-between items-center mb-2 card-bg" onclick="openCustomer(${c.id})">
                    <div class="flex-1 text-left"><h3 class="font-bold text-sm">${c.name}: ₹${Number(p.amt).toFixed(2)}</h3><p class="text-[10px] opacity-60">Due: ${fmtDate(p.date)}</p></div>
                    <div class="flex gap-2">
                        <button onclick="event.stopPropagation();settlePromise(${p.id})" class="w-10 h-10 bg-green-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-check"></i></button>
                        <button onclick="event.stopPropagation();deletePromise(${p.id})" class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('promiseHeader').innerHTML = h;
        }

        function openCustModal(cid=null) {
            const c = cid ? db.customers.find(x=>x.id===cid) : {name:'', phone:''};
            openModal(`
                <h2 class="text-xl font-black mb-6 text-center text-white uppercase">${cid?'Edit':'New'} Client</h2>
                <input id="cn" class="w-full p-5 rounded-2xl mb-4 text-black text-lg font-bold bg-white" placeholder="Name" value="${c.name}">
                <input id="cp" type="number" class="w-full p-5 rounded-2xl mb-6 text-black text-lg font-bold bg-white" placeholder="Phone" value="${c.phone}">
                <button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-white text-xl shadow-xl" onclick="saveCust(${cid})">SAVE</button>
                <button class="w-full mt-4 text-gray-400 font-bold" onclick="closeModal()">Cancel</button>
                ${cid ? `<button class="w-full p-4 bg-red-900 rounded-2xl mt-8 font-black text-white text-xs" onclick="deleteFullCust(${cid})">DELETE FULL HISTORY</button>` : ''}
            `);
        }

        function saveCust(cid) { let n = document.getElementById('cn').value; if(n) { if(cid) { let c = db.customers.find(x=>x.id===cid); c.name = n; c.phone = document.getElementById('cp').value; } else { db.customers.push({id:Date.now(), name:n, phone:document.getElementById('cp').value}); } saveDB(); closeModal(); } }
        function deleteFullCust(cid) { if(confirm("ഈ കസ്റ്റമറുടെ എല്ലാ വിവരങ്ങളും ഡിലീറ്റ് ചെയ്യണോ?")) { db.customers=db.customers.filter(x=>x.id!==cid); db.trans=db.trans.filter(x=>x.cid!==cid); activeCid=null; saveDB(); closeModal(); } }

        function openAdd(type) {
            openModal(`
                <h2 class="text-xl font-black mb-6 text-center text-white uppercase">${type}</h2>
                <input id="ta" type="number" step="0.01" class="w-full p-6 mb-4 rounded-3xl text-4xl text-center text-blue-600 bg-white font-bold" placeholder="₹ 0" autofocus>
                <div class="flex gap-2 mb-4">
                    <button id="mCash" onclick="setM('CASH')" class="flex-1 p-4 rounded-xl border-2 font-bold text-white">CASH</button>
                    <button id="mUpi" onclick="setM('UPI')" class="flex-1 p-4 rounded-xl border-2 font-bold text-white">UPI</button>
                </div>
                <input id="tr" type="text" class="w-full p-4 rounded-xl mb-4 text-black text-lg font-bold bg-white" placeholder="Remarks">
                <input id="td" type="date" class="w-full p-4 rounded-xl mb-6 text-black bg-white" value="${getToday()}">
                <input type="hidden" id="tm" value="CASH">
                <button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-xl text-white shadow-xl" onclick="saveTrans('${type}')">SAVE</button>
                <button class="w-full mt-4 text-gray-400 font-bold" onclick="closeModal()">Cancel</button>
            `);
            setM('CASH');
        }

        function setM(m) {
            document.getElementById('tm').value = m;
            document.getElementById('mCash').className = m==='CASH' ? 'flex-1 p-4 rounded-xl border-yellow-500 bg-yellow-500 text-black font-bold' : 'flex-1 p-4 rounded-xl border-white/10 bg-white/5 font-bold';
            document.getElementById('mUpi').className = m==='UPI' ? 'flex-1 p-4 rounded-xl border-blue-500 bg-blue-500 text-white font-bold' : 'flex-1 p-4 rounded-xl border-white/10 bg-white/5 font-bold';
        }

        function saveTrans(type) { let a=Number(document.getElementById('ta').value), d=document.getElementById('td').value, r=document.getElementById('tr').value, m=document.getElementById('tm').value; if(a && d){ db.trans.push({id:Date.now(), cid:activeCid, type, amt:a, date:d, rem:r, mode:m}); saveDB(); closeModal(); } }
        
        function openSettings() {
            openModal(`
                <h2 class="text-xl font-black mb-6 text-center text-white">SETTINGS</h2>
                <input id="upiI" class="w-full p-4 rounded-xl text-black mb-3 font-bold bg-white" value="${db.upi||''}" placeholder="UPI ID">
                <input id="pinI" class="w-full p-4 rounded-xl text-black mb-6 font-bold bg-white" value="${db.pin}" placeholder="PIN">
                <button class="w-full p-5 bg-blue-600 rounded-xl font-bold mb-4 text-white" onclick="db.upi=document.getElementById('upiI').value;db.pin=document.getElementById('pinI').value;saveDB();closeModal();">APPLY</button>
                <button class="w-full text-gray-400 font-bold mb-8" onclick="closeModal()">Close</button>
                <div class="grid grid-cols-2 gap-3">
                    <button class="p-4 bg-green-700 rounded-xl text-white font-bold text-xs" onclick="exportData()">BACKUP</button>
                    <button class="p-4 bg-purple-700 rounded-xl text-white font-bold text-xs" onclick="document.getElementById('imp').click()">RESTORE</button>
                </div>
                <input type="file" id="imp" class="hidden" onchange="importData(event)">
            `);
        }

        function openEditTrans(tid) {
            const t = db.trans.find(x => x.id === tid);
            openModal(`
                <h2 class="text-xl font-black mb-6 text-center text-white">EDIT ENTRY</h2>
                <input id="eta" type="number" step="0.01" class="w-full p-5 mb-4 rounded-2xl text-2xl text-center text-blue-600 bg-white font-bold" value="${t.amt}">
                <input id="etr" type="text" class="w-full p-4 rounded-xl mb-4 text-black font-bold bg-white" value="${t.rem || ''}">
                <input id="etd" type="date" class="w-full p-4 rounded-xl mb-6 text-black bg-white" value="${t.date}">
                <button class="w-full p-5 bg-blue-600 rounded-xl font-black text-white mb-3" onclick="updateTrans(${tid})">UPDATE</button>
                <button class="w-full p-5 bg-red-600 rounded-xl font-black text-white mb-4" onclick="deleteTrans(${tid})">DELETE</button>
                <button class="w-full text-gray-400 font-bold" onclick="closeModal()">Cancel</button>
            `);
        }

        function updateTrans(tid) { const t=db.trans.find(x=>x.id===tid); t.amt=Number(document.getElementById('eta').value); t.rem=document.getElementById('etr').value; t.date=document.getElementById('etd').value; saveDB(); closeModal(); }
        function deleteTrans(tid) { if(confirm("Delete?")) { db.trans=db.trans.filter(x=>x.id!==tid); saveDB(); closeModal(); } }
        function openPromiseModal() { openModal(`<h2 class="text-xl font-black mb-6 text-center text-white">ADD PROMISE</h2><input id="pa" type="number" step="0.01" class="w-full p-5 rounded-2xl mb-4 text-black font-bold bg-white" placeholder="Amount"><input id="pd" type="date" class="w-full p-5 rounded-2xl mb-6 text-black bg-white" value="${getToday()}"><button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-white" onclick="savePromise()">SET PROMISE</button><button class="w-full mt-4 text-gray-400 font-bold" onclick="closeModal()">Cancel</button>`); }
        function savePromise() { let a=document.getElementById('pa').value, d=document.getElementById('pd').value; if(a&&d){ db.promises.push({id:Date.now(), cid:activeCid, amt:a, date:d}); saveDB(); closeModal(); } }
        function settlePromise(id) { const p=db.promises.find(x=>x.id===id); db.trans.push({id:Date.now(), cid:p.cid, type:'GOT', amt:Number(p.amt), date:getToday(), mode:'CASH', rem:'Promise Paid'}); db.promises=db.promises.filter(x=>x.id!==id); saveDB(); }

        function openPDFModal() {
            openModal(`
                <h2 class="mb-4 font-bold text-center text-white">GENERATE REPORT</h2>
                <div class="space-y-4">
                    <input id="ps" type="date" class="w-full p-4 rounded-xl text-black bg-white" value="2026-01-01">
                    <input id="pe" type="date" class="w-full p-4 rounded-xl text-black bg-white" value="${getToday()}">
                    <button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-white shadow-xl" onclick="generatePDF()">DOWNLOAD PDF</button>
                    <button class="w-full text-gray-400 font-bold" onclick="closeModal()">Close</button>
                </div>
            `);
        }

        function generatePDF() {
            const s=document.getElementById('ps').value, e=document.getElementById('pe').value, cust=db.customers.find(c=>c.id===activeCid);
            const filtered=db.trans.filter(t=>t.cid===activeCid && t.date>=s && t.date<=e).sort((a,b)=>new Date(a.date)-new Date(b.date));
            const el=document.createElement('div'); el.style.padding="30px"; el.style.background="#fff"; el.style.color="#000"; el.style.fontSize="12px";
            let rt=0;
            let rows=filtered.map(t=>{ rt+=(t.type==='GAVE'?t.amt:-t.amt); return `<tr><td style="border:1px solid #ddd;padding:8px">${fmtDate(t.date)}<br><small>${t.rem||''}</small></td><td style="border:1px solid #ddd;padding:8px;color:red">${t.type==='GAVE'?'₹'+t.amt.toFixed(2):'-'}</td><td style="border:1px solid #ddd;padding:8px;color:green">${t.type==='GOT'?'₹'+t.amt.toFixed(2):'-'}</td><td style="border:1px solid #ddd;padding:8px">${t.mode||'CASH'}</td><td style="border:1px solid #ddd;padding:8px;font-weight:bold">₹${rt.toFixed(2)}</td></tr>`; }).join('');
            el.innerHTML=`<h2 style="text-align:center;margin-bottom:10px">${cust.name} - Statement</h2><p style="text-align:center;margin-bottom:20px">${fmtDate(s)} to ${fmtDate(e)}</p><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f2f2f2"><th>Date</th><th>Gave</th><th>Got</th><th>Mode</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
            html2pdf().set({ margin: 1, filename: `${cust.name}_Statement.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(el).save();
        }

        function openQR(amt) {
            if(!db.upi) return alert("Settings-ൽ UPI ID നൽകുക");
            const cust = db.customers.find(c => c.id === activeCid);
            openModal(`
                <div class="bg-white p-6 rounded-[2.5rem] flex flex-col items-center">
                    <div id="qr" class="mb-4"></div>
                    <p class="text-black font-black text-3xl">₹${Number(amt).toFixed(2)}</p>
                    <div class="w-full mt-6 space-y-2">
                        <button onclick="shareWA('${cust ? cust.phone : ''}', ${amt})" class="w-full p-4 rounded-xl bg-green-600 text-white font-bold"><i class="fa-brands fa-whatsapp"></i> WhatsApp Share</button>
                        <button onclick="closeModal()" class="w-full p-4 rounded-xl bg-red-500 text-white font-bold">Close</button>
                    </div>
                </div>
            `);
            new QRCode(document.getElementById("qr"), { text: `upi://pay?pa=${db.upi}&am=${amt}&cu=INR`, width: 220, height: 220 });
        }

        function shareWA(p, b) { if(!p) return alert("Phone Number Missing"); const msg = `നിങ്ങളുടെ ബാക്കി തുക: ₹${Math.abs(b).toFixed(2)}. ദയവായി പരിശോധിക്കുക.`; window.open(`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`); }
        function exportData() { const blob=new Blob([JSON.stringify(db)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Khata_Backup.json`; a.click(); }
        function importData(e) { const reader=new FileReader(); reader.onload=(ev)=>{ try { db=JSON.parse(ev.target.result); saveDB(); location.reload(); } catch(e){alert("Error");} }; reader.readAsText(e.target.files[0]); }
        
        function openCustomer(id) { activeCid = id; render(); }
        function goHome() { activeCid = null; render(); }
        function openModal(h) { document.getElementById('modalBox').innerHTML=h; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        window.onload = () => { lockApp(); };
    </script>

    <div id="modalOverlay" class="fixed inset-0 bg-black/80 hidden z-[1000] items-end justify-center p-4" onclick="closeModal()">
        <div id="modalBox" class="w-full max-w-[420px] bg-[#161b2e] p-6 rounded-t-[3rem] text-white overflow-y-auto max-h-[85vh] relative shadow-2xl" onclick="event.stopPropagation()"></div>
    </div>
</body>
            </html>
