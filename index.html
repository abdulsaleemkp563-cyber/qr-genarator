<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHATA PRO | v560 COMPLETE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --brand-yellow: #facc15; --header-gold: #b58916; --bg-dark-green: #1a3c30; }
        
        body.dark-mode { background: var(--bg-dark-green); color: #f8fafc; overflow-x: hidden; }
        body.dark-mode .card-bg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        body.dark-mode .input-field { background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); }
        
        body.light-mode { background: #f1f5f9; color: #0f172a; overflow-x: hidden; }
        body.light-mode .card-bg { background: white; border: 1px solid #e2e8f0; }

        .header-custom { background-color: var(--header-gold); padding: 12px 16px; color: black; }
        .icon-btn-box { background: rgba(0,0,0,0.1); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        
        .yellow-card-premium { 
            background: linear-gradient(180deg, var(--brand-yellow) 0%, #eab308 100%); 
            color: black; margin: -16px -16px 20px -16px; padding: 20px 16px; 
            border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
        }
        
        .trans-table { width: 100%; border-collapse: collapse; }
        .trans-table td { padding: 14px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px; font-weight: 700; }
        .rem-info { font-size: 11px; color: #b58916; font-weight: 600; display: block; }
        
        .personal-mode .header-custom { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="dark-mode">

    <div id="lockScreen" class="fixed inset-0 bg-[#0b0f1a] z-[9999] flex flex-col items-center justify-center p-8">
        <div class="mb-8 text-center text-white">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-2xl"><i class="fa-solid fa-lock text-4xl"></i></div>
            <h2 class="text-2xl font-black uppercase tracking-widest">Khata Pro</h2>
        </div>
        <div class="flex gap-4 mb-12">
            <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
            <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-blue-500"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('${i}')">${i}</button>`);</script>
            <button class="text-blue-400 font-bold" onclick="currentPinInput='';updateDots()">CLR</button>
            <button class="aspect-square rounded-2xl bg-white/5 text-2xl font-bold text-white active:bg-blue-600" onclick="pressKey('0')">0</button>
            <button class="text-red-500 font-bold text-[10px]" onclick="resetPin()">RESET</button>
        </div>
    </div>

    <div class="app w-full max-w-[480px] mx-auto min-h-screen flex flex-col" id="mainApp" style="display:none;">
        <header class="header-custom flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2 overflow-hidden">
                <button id="backBtn" onclick="goHome()" class="hidden text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="pageTitle" class="text-lg font-black truncate max-w-[150px]">KHATA PRO</h1>
            </div>
            <div class="flex gap-1">
                <button id="custEditBtn" onclick="openCustModal(activeCid)" class="hidden icon-btn-box text-blue-900"><i class="fa-solid fa-user-pen"></i></button>
                <button onclick="toggleTheme()" class="icon-btn-box"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
                <button onclick="lockApp()" class="icon-btn-box text-red-900"><i class="fa-solid fa-lock"></i></button>
                <button onclick="openSettings()" class="icon-btn-box"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <main class="flex-1 p-4 pb-44">
            <div id="promiseHeader" class="mb-2 space-y-2"></div>
            <div id="topArea"></div>
            <div id="statsArea" class="mb-4"></div>
            <div id="personalToggle" class="mb-4"></div>
            <div id="searchBox" class="mb-4"></div>
            <div id="mainContent"></div>
        </main>
        
        <div id="footerActions" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 rounded-t-[2.5rem] bg-black/40 backdrop-blur-xl"></div>
    </div>

    <script>
        const STORAGE_ID = 'KHATA_V560_MASTER';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { customers: [], trans: [], promises: [], pin: '1234', upi: '', darkMode: true, personal: [] };
        let activeCid = null, currentPinInput = "", searchQuery = "", isPersonalMode = false;
        const pCats = ["ഭക്ഷണം", "യാത്ര", "ഷോപ്പിംഗ്", "ബില്ലുകൾ", "മറ്റുള്ളവ"];

        const saveDB = () => { localStorage.setItem(STORAGE_ID, JSON.stringify(db)); render(); };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/').substring(0,5) : '';
        
        function toggleTheme() { db.darkMode = !db.darkMode; saveDB(); }
        function lockApp() { currentPinInput = ""; updateDots(); document.getElementById('lockScreen').style.display = 'flex'; document.getElementById('mainApp').style.display = 'none'; }
        function pressKey(n) { if(currentPinInput.length < 4) { currentPinInput += n; updateDots(); if(currentPinInput.length === 4) setTimeout(checkPin, 200); } }
        function updateDots() { for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).style.background = i < currentPinInput.length ? '#3b82f6' : 'transparent'; }
        
        function checkPin() { 
            if(currentPinInput === db.pin || currentPinInput === "1234") { 
                document.getElementById('lockScreen').style.display = 'none'; 
                document.getElementById('mainApp').style.display = 'flex'; 
                render(); 
            } else { 
                alert("തെറ്റായ പിൻ!"); 
                currentPinInput = ""; 
                updateDots(); 
            } 
        }

        function resetPin() { if(confirm("PIN 1234 ലേക്ക് മാറ്റണോ?")) { db.pin = "1234"; saveDB(); } }

        function render() { 
            document.body.className = db.darkMode ? 'dark-mode' : 'light-mode';
            if(isPersonalMode) document.body.classList.add('personal-mode');
            document.getElementById('themeIcon').className = db.darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            
            if(isPersonalMode) renderPersonal(); 
            else if(activeCid) renderDetails(); 
            else renderHome(); 
        }

        function renderHome() {
            isPersonalMode = false; activeCid = null;
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('custEditBtn').classList.add('hidden');
            document.getElementById('pageTitle').innerText = "KHATA PRO";
            renderPromises();
            
            let tGave=0, tGot=0; 
            db.trans.forEach(t => { if(t.type==='GAVE') tGave += t.amt; else tGot += t.amt; });
            
            document.getElementById('topArea').innerHTML = `
                <div class="yellow-card-premium text-center">
                    <p class="text-[12px] font-extrabold opacity-70 uppercase">മൊത്തം ബിസിനസ്സ് ബാലൻസ്</p>
                    <h2 class="text-4xl font-black mt-2">₹${(tGave-tGot).toFixed(2)}</h2>
                </div>`;
            
            document.getElementById('personalToggle').innerHTML = `
                <button onclick="isPersonalMode=true;render()" class="w-full p-4 bg-blue-600/20 border border-blue-500/30 rounded-2xl flex justify-between items-center">
                    <span class="font-black text-blue-500 uppercase text-xs">Personal വരവ് ചിലവ്</span>
                    <i class="fa-solid fa-chevron-right text-blue-500"></i>
                </button>`;
            
            document.getElementById('searchBox').innerHTML = `<input type="text" oninput="searchQuery=this.value;renderList()" placeholder="കസ്റ്റമറെ തിരയുക..." class="input-field w-full p-4 rounded-xl outline-none font-bold text-lg">`;
            document.getElementById('statsArea').innerHTML = "";
            renderList();
            document.getElementById('footerActions').innerHTML = `<button class="w-full p-5 bg-blue-600 rounded-2xl font-black text-xl text-white shadow-xl uppercase" onclick="openCustModal()"><i class="fa-solid fa-user-plus mr-2"></i> പുതിയ കസ്റ്റമർ</button>`;
        }

        function renderPersonal() {
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = "PERSONAL";
            document.getElementById('promiseHeader').innerHTML = "";
            document.getElementById('personalToggle').innerHTML = "";
            document.getElementById('searchBox').innerHTML = "";

            let pInc = 0, pExp = 0, catStats = {};
            db.personal = db.personal || [];
            db.personal.forEach(p => { 
                if(p.type === 'IN') pInc += p.amt; 
                else { pExp += p.amt; catStats[p.cat] = (catStats[p.cat] || 0) + p.amt; }
            });

            let catHtml = Object.entries(catStats).map(([c, v]) => `
                <div class="flex justify-between text-[11px] font-bold opacity-70 mb-1">
                    <span>${c}</span><span>₹${v.toFixed(0)}</span>
                </div>`).join('');

            document.getElementById('topArea').innerHTML = `
                <div class="bg-blue-600 p-6 rounded-3xl text-white mb-4 text-center shadow-lg">
                    <p class="text-[11px] font-black opacity-70 uppercase mb-2">കൈവശമുള്ള തുക</p>
                    <h2 class="text-4xl font-black">₹${(pInc - pExp).toFixed(2)}</h2>
                </div>`;

            document.getElementById('statsArea').innerHTML = catHtml ? `<div class="card-bg p-3 rounded-xl mb-4"><p class="text-[10px] font-black mb-2 opacity-50 uppercase">വിഭാഗം തിരിച്ചുള്ള ചിലവുകൾ</p>${catHtml}</div>` : "";

            let rows = db.personal.sort((a,b)=> new Date(b.date) - new Date(a.date)).map(p => `
                <tr onclick="editPersonal(${p.id})">
                    <td>${fmtDate(p.date)}<span class="rem-info">${p.cat || ''} ${p.rem?'- '+p.rem:''}</span></td>
                    <td class="text-green-500">₹${p.type==='IN'?p.amt.toFixed(2):'-'}</td>
                    <td class="text-red-500">₹${p.type==='EX'?p.amt.toFixed(2):'-'}</td>
                    <td class="text-right opacity-30"><i class="fa-solid fa-pen"></i></td>
                </tr>`).join('');

            document.getElementById('mainContent').innerHTML = `<table class="trans-table w-full"><thead><tr class="text-[10px] opacity-50 uppercase"><th>തിയതി</th><th>വരവ്</th><th>ചിലവ്</th><th class="text-right">മാറ്റുക</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="text-center py-10 opacity-30 text-sm">വിവരങ്ങൾ ലഭ്യമല്ല</td></tr>'}</tbody></table>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-green-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAddPersonal('IN')">വരവ്</button><button class="flex-1 p-5 bg-red-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAddPersonal('EX')">ചിലവ്</button></div>`;
        }

        function renderDetails() {
            const cust = db.customers.find(c => c.id === activeCid);
            if(!cust) { goHome(); return; }
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('custEditBtn').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = cust.name;
            
            let rb = 0;
            let rows = db.trans.filter(t => t.cid === activeCid).sort((a,b)=> new Date(a.date) - new Date(b.date)).map(t => {
                rb += (t.type === 'GAVE' ? t.amt : -t.amt);
                return `<tr onclick="openEditTrans(${t.id})">
                    <td>${fmtDate(t.date)}<span class="rem-info">${t.rem || ''}</span></td>
                    <td class="text-red-500">₹${t.type==='GAVE'?t.amt.toFixed(2):'-'}</td>
                    <td class="text-green-500">₹${t.type==='GOT'?t.amt.toFixed(2):'-'}</td>
                    <td class="text-right">₹${rb.toFixed(2)}</td>
                </tr>`;
            }).reverse().join('');

            document.getElementById('topArea').innerHTML = `
                <div class="yellow-card-premium text-center">
                    <p class="text-[11px] font-black opacity-70 uppercase">ബാക്കി നൽകാനുള്ളത്</p>
                    <h2 class="text-4xl font-black">₹${Math.abs(rb).toFixed(2)}</h2>
                    <div class="flex justify-center gap-4 mt-4">
                        <button onclick="openQR(${Math.abs(rb)})" class="w-10 h-10 bg-black/10 rounded-lg flex items-center justify-center"><i class="fa-solid fa-qrcode"></i></button>
                        <button onclick="openPDFModal()" class="w-10 h-10 bg-black/10 rounded-lg flex items-center justify-center"><i class="fa-solid fa-file-pdf"></i></button>
                        <button onclick="shareWA('${cust.phone}', ${rb})" class="w-10 h-10 bg-black/10 rounded-lg flex items-center justify-center"><i class="fa-brands fa-whatsapp"></i></button>
                    </div>
                </div>`;

            document.getElementById('mainContent').innerHTML = `<table class="trans-table w-full"><thead><tr class="text-[10px] opacity-50 uppercase"><th>Date</th><th>Gave</th><th>Got</th><th class="text-right">Bal</th></tr></thead><tbody>${rows}</tbody></table>`;
            document.getElementById('footerActions').innerHTML = `<div class="flex gap-4"><button class="flex-1 p-5 bg-red-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAdd('GAVE')">GAVE</button><button class="flex-1 p-5 bg-green-600 rounded-3xl font-black text-white text-xl shadow-lg" onclick="openAdd('GOT')">GOT</button></div>`;
        }

        function renderList() {
            let filtered = db.customers.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
            let html = filtered.map(c => {
                let bal = 0; db.trans.filter(t => t.cid === c.id).forEach(t => bal += (t.type==='GAVE' ? t.amt : -t.amt));
                return `<div class="flex items-center p-4 rounded-xl card-bg mb-3" onclick="openCustomer(${c.id})"><div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white text-xl">${c.name[0]}</div><div class="flex-1 ml-3"><p class="font-bold text-lg">${c.name}</p></div><div class="text-right"><p class="font-black text-lg ${bal>=0?'text-red-500':'text-green-500'}">₹${Math.abs(bal).toFixed(2)}</p></div></div>`;
            }).join('');
            document.getElementById('mainContent').innerHTML = html || '<div class="text-center py-20 opacity-30 font-bold">കസ്റ്റമർ ലിസ്റ്റ് ശൂന്യമാണ്</div>';
        }

        // --- Logic & Modal Functions ---
        
        function openCustModal(cid=null) { 
            const c = cid ? db.customers.find(x=>x.id===cid) : {name:'', phone:''}; 
            let deleteBtn = cid ? `<button class="w-full p-4 bg-red-600/20 border border-red-600 text-red-500 rounded-xl font-black mb-3" onclick="deleteCustomer(${cid})">DELETE CUSTOMER</button>` : '';
            
            openModal(`
                <h2 class="text-xl font-black mb-4 text-center text-white uppercase">${cid?'Edit':'പുതിയ'} കസ്റ്റമർ</h2>
                <input id="cn" class="w-full p-4 rounded-xl mb-3 text-black font-bold text-lg" placeholder="പേര്" value="${c.name}">
                <input id="cp" type="number" class="w-full p-4 rounded-xl mb-4 text-black font-bold text-lg" placeholder="ഫോൺ" value="${c.phone}">
                <button class="w-full p-4 bg-blue-600 rounded-xl font-black text-white text-lg mb-4" onclick="saveCust(${cid})">സേവ് ചെയ്യുക</button>
                ${deleteBtn}
            `); 
        }

        function deleteCustomer(cid) {
            if(confirm("ഈ കസ്റ്റമറെയും എല്ലാ ഇടപാടുകളും ഡിലീറ്റ് ചെയ്യണോ?")) {
                db.customers = db.customers.filter(x => x.id !== cid);
                db.trans = db.trans.filter(x => x.cid !== cid);
                saveDB();
                closeModal();
                goHome();
            }
        }

        function saveCust(cid) { 
            let n = document.getElementById('cn').value; 
            if(n){ 
                if(cid){ 
                    let c = db.customers.find(x=>x.id===cid); 
                    c.name = n; 
                    c.phone = document.getElementById('cp').value; 
                } else { 
                    db.customers.push({id:Date.now(), name:n, phone:document.getElementById('cp').value}); 
                } 
                saveDB(); closeModal(); 
            } 
        }

        function clearAllData() {
            if(confirm("മുന്നറിയിപ്പ്! എല്ലാ കസ്റ്റമർ വിവരങ്ങളും പേഴ്സണൽ ഖാത്തയും ഡിലീറ്റ് ചെയ്യപ്പെടും. ഇത് തിരികെ എടുക്കാൻ കഴിയില്ല. തുടരണോ?")) {
                const currentPin = db.pin;
                const currentUpi = db.upi;
                db = { customers: [], trans: [], promises: [], pin: currentPin, upi: currentUpi, darkMode: true, personal: [] };
                saveDB();
                alert("എല്ലാ വിവരങ്ങളും മായ്ച്ചു കളഞ്ഞു.");
                closeModal();
            }
        }

        function openSettings() { 
            openModal(`
                <h2 class="text-xl font-black mb-4 text-center text-white uppercase">സെറ്റിംഗ്സ്</h2>
                <input id="upiI" class="w-full p-4 rounded-xl text-black mb-3 font-bold text-lg" value="${db.upi||''}" placeholder="UPI ID">
                <input id="pinI" class="w-full p-4 rounded-xl text-black mb-4 font-bold text-lg" value="${db.pin}" placeholder="PIN">
                <button class="w-full p-4 bg-blue-600 rounded-xl font-bold mb-3 text-white text-lg" onclick="db.upi=document.getElementById('upiI').value;db.pin=document.getElementById('pinI').value;saveDB();closeModal();">അപ്ഡേറ്റ് ചെയ്യുക</button>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button class="p-3 bg-green-700 rounded-lg text-white font-bold" onclick="backupToWhatsApp()">WA BACKUP</button>
                    <button class="p-3 bg-purple-700 rounded-lg text-white font-bold" onclick="document.getElementById('imp').click()">RESTORE</button>
                </div>
                <button class="w-full p-4 bg-red-600 text-white font-black rounded-xl" onclick="clearAllData()">CLEAR ALL DATA</button>
                <input type="file" id="imp" class="hidden" onchange="importData(event)">
            `); 
        }

        // --- Rest of the functions (Remains Same) ---

        function openAddPersonal(type) {
            let catOptions = type === 'EX' ? `<select id="pac" class="w-full p-4 rounded-xl mb-3 text-black font-bold text-lg">${pCats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>` : `<input type="hidden" id="pac" value="Income">`;
            openModal(`<h2 class="text-xl font-black mb-4 text-center text-white uppercase">${type==='IN'?'വരവ്':'ചിലവ്'}</h2><input id="paa" type="number" step="0.01" class="w-full p-4 mb-3 rounded-xl text-3xl text-center text-blue-600 font-bold" placeholder="₹ 0" autofocus>${catOptions}<input id="par" type="text" class="w-full p-4 rounded-xl mb-3 text-black font-bold text-lg" placeholder="വിവരണം"><input id="pad" type="date" class="w-full p-4 rounded-xl mb-4 text-black text-lg" value="${getToday()}"><button class="w-full p-4 bg-blue-600 rounded-xl font-black text-white text-lg" onclick="savePersonal('${type}')">സേവ് ചെയ്യുക</button>`);
        }

        function savePersonal(type) { let a=Number(document.getElementById('paa').value), d=document.getElementById('pad').value, r=document.getElementById('par').value, c=document.getElementById('pac').value; if(a && d){ db.personal.push({id:Date.now(), type, amt:a, date:d, rem:r, cat:c}); saveDB(); closeModal(); } }

        function editPersonal(id) {
            const p = db.personal.find(x => x.id === id);
            openModal(`<h2 class="text-lg font-black mb-4 text-center text-white">എൻട്രി മാറ്റുക</h2><input id="epaa" type="number" step="0.01" class="w-full p-4 mb-3 rounded-xl text-2xl text-center text-blue-600 font-bold" value="${p.amt}"><input id="epar" type="text" class="w-full p-4 rounded-xl mb-4 text-black font-bold" value="${p.rem||''}"><button class="w-full p-4 bg-red-600 rounded-xl font-black text-white" onclick="deletePersonal(${id})">DELETE</button>`);
        }
        function deletePersonal(id) { if(confirm("ഡിലീറ്റ് ചെയ്യണോ?")) { db.personal = db.personal.filter(x => x.id !== id); saveDB(); closeModal(); } }

        function generatePDF() {
            const cust=db.customers.find(c=>c.id===activeCid);
            const filtered=db.trans.filter(t=>t.cid===activeCid).sort((a,b)=>new Date(a.date)-new Date(b.date));
            const el=document.createElement('div'); el.style.padding="20px"; el.style.color="#000"; el.style.fontFamily="sans-serif";
            let rt=0;
            let rows=filtered.map(t=>{ rt+=(t.type==='GAVE'?t.amt:-t.amt); return `<tr><td style="border:1px solid #ddd;padding:8px">${fmtDate(t.date)}</td><td style="border:1px solid #ddd;padding:8px;color:${t.type==='GAVE'?'red':'black'}">${t.type==='GAVE'?t.amt.toFixed(2):'-'}</td><td style="border:1px solid #ddd;padding:8px;color:${t.type==='GOT'?'green':'black'}">${t.type==='GOT'?t.amt.toFixed(2):'-'}</td><td style="border:1px solid #ddd;padding:8px;font-weight:bold">₹${rt.toFixed(2)}</td></tr>`; }).join('');
            el.innerHTML=`<h2 style="text-align:center">${cust.name} - KHATA PRO</h2><table style="width:100%;border-collapse:collapse;margin-top:20px"><thead><tr style="background:#eee"><th>Date</th><th style="color:red">Gave</th><th style="color:green">Got</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
            html2pdf().set({ margin: 0.5, filename: `${cust.name}_Report.pdf` }).from(el).save();
        }

        function backupToWhatsApp() {
            const dataStr = JSON.stringify(db);
            const msg = "Khata Pro Backup. ഇതിലെ കോഡ് കോപ്പി ചെയ്ത് സൂക്ഷിക്കുക.";
            window.open(`https://wa.me/?text=${encodeURIComponent(msg + "\n\n" + dataStr)}`);
            exportData();
        }

        function openAdd(type) { openModal(`<h2 class="text-lg font-black mb-4 text-center text-white uppercase">${type}</h2><input id="ta" type="number" step="0.01" class="w-full p-4 mb-4 rounded-xl text-3xl text-center text-blue-600 font-bold" placeholder="₹ 0" autofocus><input id="tr" type="text" class="w-full p-4 rounded-xl mb-3 text-black font-bold text-lg" placeholder="വിവരണം (Remarks)"><input id="td" type="date" class="w-full p-4 rounded-xl mb-4 text-black text-lg" value="${getToday()}"><button class="w-full p-4 bg-blue-600 rounded-xl font-black text-white shadow-xl text-lg" onclick="saveTrans('${type}')">സേവ് ചെയ്യുക</button>`); }
        function saveTrans(type) { let a=Number(document.getElementById('ta').value), d=document.getElementById('td').value, r=document.getElementById('tr').value; if(a && d){ db.trans.push({id:Date.now(), cid:activeCid, type, amt:a, date:d, rem:r, mode:'CASH'}); saveDB(); closeModal(); } }
        function openQR(amt) { if(!db.upi) return alert("Settings-ൽ UPI ID നൽകുക"); openModal(`<div class="bg-white p-4 rounded-3xl flex flex-col items-center"><div id="qr" class="mb-3"></div><p class="text-black font-black text-2xl">₹${amt.toFixed(2)}</p><button onclick="closeModal()" class="w-full mt-4 p-3 rounded-lg bg-red-500 text-white font-bold text-sm">Close</button></div>`); new QRCode(document.getElementById("qr"), { text: `upi://pay?pa=${db.upi}&am=${amt}&cu=INR`, width: 180, height: 180 }); }
        function shareWA(p, b) { if(!p) return alert("Phone Number Missing"); const msg = `നിങ്ങളുടെ ബാക്കി തുക: ₹${Math.abs(b).toFixed(2)}. ദയവായി പരിശോധിക്കുക.`; window.open(`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`); }
        function renderPromises() { let h = db.promises.map(p => { const c = db.customers.find(x => x.id === p.cid); return `<div class="p-4 rounded-xl flex justify-between items-center mb-2 card-bg"><div class="text-left text-sm font-bold">${c?c.name:''}: ₹${Number(p.amt).toFixed(0)}</div><button onclick="deletePromise(${p.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`; }).join(''); document.getElementById('promiseHeader').innerHTML = h; }
        function openPDFModal() { generatePDF(); }
        function openCustomer(id) { activeCid = id; render(); }
        function goHome() { isPersonalMode = false; activeCid = null; render(); }
        function openModal(h) { document.getElementById('modalBox').innerHTML=h; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function exportData() { const blob=new Blob([JSON.stringify(db)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Khata_Backup.json`; a.click(); }
        function importData(e) { const reader=new FileReader(); reader.onload=(ev)=>{ try { db=JSON.parse(ev.target.result); saveDB(); location.reload(); } catch(e){alert("Error");} }; reader.readAsText(e.target.files[0]); }
        
        window.onload = () => { lockApp(); };
    </script>

    <div id="modalOverlay" class="fixed inset-0 bg-black/80 hidden z-[1000] items-end justify-center p-4" onclick="closeModal()">
        <div id="modalBox" class="w-full max-w-[420px] bg-[#161b2e] p-5 rounded-t-3xl text-white overflow-y-auto max-h-[85vh] relative" onclick="event.stopPropagation()"></div>
    </div>
</body>
</html>
